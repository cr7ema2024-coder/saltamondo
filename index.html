<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#dff1ff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="Saltamondo: un platform per tutta la famiglia. Crea il tuo personaggio e salta tra prati, spiagge, montagne e la modalità Halloween.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23ffd23f' stroke='%23c98a00' stroke-width='3'/%3E%3Cpath d='M16 8l2.4 5 5.4.6-4 3.7 1.1 5.3L16 20l-4.9 2.6 1.1-5.3-4-3.7 5.4-.6z' fill='%23e8a400'/%3E%3C/svg%3E">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Saltamondo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Creepster&family=Fredoka:wght@400;500;600;700&family=Lilita+One&family=Silkscreen&display=swap">
<style>
/* Layout: the game window fills the page and carries every menu; nothing else is on the page.
   Single look per mode, chosen on purpose: sunny for the classic game, night purple for Halloween. */
:root {
  --bg: #dff1ff;
  --panel: #ffffff;
  --line: #b7d3ee;
  --ink: #1f2a44;
  --muted: #54627f;
  --accent: #ff7a2f;
  --accent-ink: #2a1205;
  --good: #3fae4a;
  --stage: #8fd4ff;
  --menu-a: rgba(255, 255, 255, 0.86);
  --menu-b: rgba(214, 238, 255, 0.95);
  --display: "Lilita One", "Fredoka", "Trebuchet MS", sans-serif;
  --body: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
  --pixel: "Silkscreen", "Courier New", monospace;
  color-scheme: light;
}
:root[data-mode="halloween"] {
  --bg: #1b1330;
  --panel: #2a1f45;
  --line: #4a3873;
  --ink: #f7f0ff;
  --muted: #c1b4df;
  --accent: #ff8a2a;
  --accent-ink: #2a1205;
  --good: #8fe060;
  --stage: #120c22;
  --menu-a: rgba(52, 30, 88, 0.82);
  --menu-b: rgba(16, 9, 30, 0.94);
  --display: "Creepster", "Fredoka", cursive;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; background: var(--bg); color: var(--ink); }
body { margin: 0; font-family: var(--body); font-size: 16px; line-height: 1.5; }
.wrap {
  box-sizing: border-box;
  min-height: 100%;
  display: grid;
  place-items: center;
  padding-block: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
html { touch-action: manipulation; }
.game {
  position: relative;
  width: min(100%, calc((100vh - 30px) * 480 / 272), 1200px);
}
@supports (height: 100dvh) {
  .game { width: min(100%, calc((100dvh - 30px) * 480 / 272), 1200px); }
}
.stage {
  position: relative;
  width: 100%;
  box-sizing: border-box;
  border: 3px solid var(--line);
  border-radius: 14px;
  background: var(--stage);
  overflow: hidden;
  box-shadow: 0 22px 50px -28px rgba(20, 40, 80, 0.5);
}
.stage:focus-within { border-color: var(--accent); }
canvas#game {
  display: block;
  width: 100%;
  max-width: 100%;
  height: auto;
  aspect-ratio: 480 / 272;
  outline: none;
  touch-action: none;
}

button, input {
  font-family: var(--body);
  font-weight: 600;
  font-size: 15px;
  color: var(--ink);
  background: var(--panel);
  border: 2px solid var(--line);
  border-radius: 10px;
  padding: 7px 14px;
}
button { cursor: pointer; }
button:hover:not(:disabled) { border-color: var(--accent); }
button:focus-visible, input:focus-visible { outline: 3px solid var(--good); outline-offset: 2px; }
button:disabled { opacity: 0.45; cursor: not-allowed; }

.pausebtn {
  position: absolute;
  top: 1.2%;
  left: 50%;
  transform: translateX(-50%);
  padding: 2px 12px;
  font-size: 13px;
  color: #ffffff;
  background: rgba(20, 16, 40, 0.55);
  border-color: transparent;
}

.dialog {
  position: absolute;
  left: 50%;
  bottom: 4%;
  transform: translateX(-50%);
  width: min(92%, 640px);
  box-sizing: border-box;
  display: flex;
  gap: 12px;
  align-items: flex-start;
  padding: 10px 14px;
  background: #fffaf0;
  color: #2a1a3a;
  border: 3px solid #2a1a3a;
  border-radius: 12px;
  box-shadow: 0 5px 0 rgba(0, 0, 0, 0.25);
  cursor: pointer;
}
.dialog canvas { flex: none; width: clamp(40px, 8vw, 60px); height: auto; aspect-ratio: 1; image-rendering: pixelated; background: #dff1ff; border: 2px solid #2a1a3a; border-radius: 8px; }
.dialog .txt { min-width: 0; flex: 1; }
.dialog .who { margin: 0; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #c05a10; }
.dialog .say { margin: 2px 0 0; min-height: 2.8em; font-size: clamp(13px, 2.3vw, 19px); font-weight: 500; line-height: 1.35; }
.dialog .say.typing::after { content: "\258C"; color: #c05a10; animation: blink 0.8s steps(1) infinite; }
.dialog .next { margin: 4px 0 0; font-size: 12px; color: #7a6a8a; }
@keyframes blink { 50% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .dialog .say.typing::after { animation: none; } }

.touch, .rotate { display: none; }
.game:not(.playing) .touch { visibility: hidden; }
@media all {
  :root.touchmode, :root.touchmode body { overscroll-behavior: none; }
  :root.touchmode .game, :root.touchmode .touch { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  :root.touchmode .touch {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    padding: 0 3% 3%;
    pointer-events: none;
  }
  :root.touchmode .touch .grp { display: flex; gap: 10px; align-items: flex-end; pointer-events: auto; }
  :root.touchmode .touch button {
    width: clamp(52px, 9vw, 84px);
    height: clamp(52px, 9vw, 84px);
    padding: 0;
    border-radius: 50%;
    font-size: 22px;
    color: #ffffff;
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
    background: rgba(20, 30, 60, 0.28);
    border: 2px solid rgba(255, 255, 255, 0.75);
    touch-action: none;
  }
  :root.touchmode .touch .big { width: clamp(64px, 11vw, 100px); height: clamp(64px, 11vw, 100px); font-size: 28px; }
  :root.touchmode .touch button.on { background: rgba(255, 255, 255, 0.6); color: #1f2a44; }
  :root.touchmode .pausebtn { font-size: 15px; padding: 6px 18px; }
}
@media (orientation: portrait) {
  :root.touchmode .game { width: 100%; }
  :root.touchmode .touch { position: static; padding: 18px 2% 0; }
  :root.touchmode .touch button { width: 76px; height: 76px; color: var(--ink); text-shadow: none; background: var(--panel); border-color: var(--line); }
  :root.touchmode .touch .big { width: 96px; height: 96px; }
  :root.touchmode .touch button.on { background: var(--line); }
  :root.touchmode .pausebtn { font-size: 12px; padding: 2px 10px; }
  :root.touchmode .rotate { display: block; margin: 14px 0 0; text-align: center; color: var(--muted); font-size: 14px; }
}


.menu {
  position: absolute;
  inset: 0;
  display: flex;
  overflow: auto;
  padding: clamp(8px, 2.5vw, 24px);
  background: radial-gradient(ellipse at 50% 25%, var(--menu-a), var(--menu-b));
}
.scr {
  margin: auto;
  width: 100%;
  max-width: 620px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: clamp(6px, 1.4vw, 12px);
  text-align: center;
}
.logo, .scr h2 {
  margin: 0;
  font-family: var(--display);
  font-weight: 400;
  line-height: 1;
  color: var(--accent);
  letter-spacing: 0.02em;
  text-shadow: 0 3px 0 rgba(0, 0, 0, 0.18);
  text-wrap: balance;
}
.logo { font-size: clamp(32px, 7.5vw, 68px); }
.logo small { display: block; font-size: 0.42em; color: var(--good); margin-top: 4px; }
.scr h2 { font-size: clamp(24px, 5vw, 44px); }
.hello { margin: 0; font-size: clamp(14px, 2.2vw, 18px); color: var(--ink); }
.coin { color: #c98a00; font-weight: 700; font-variant-numeric: tabular-nums; }
:root[data-mode="halloween"] .coin { color: #ffd23f; }
.row { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 6px; }
.lbl { font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); min-width: 0; }
.seg button[aria-checked="true"] { background: var(--good); border-color: var(--good); color: #10260a; }
.note { margin: 0; min-height: 1.4em; font-size: clamp(12px, 1.8vw, 14px); color: var(--muted); max-width: 52ch; }
.small { font-size: 13px; padding: 4px 10px; }
.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-size: clamp(15px, 2.4vw, 20px); padding: 7px 28px; }
.primary:hover:not(:disabled) { border-color: var(--ink); }
.acct { display: flex; gap: 12px; align-items: center; text-align: left; max-width: 52ch; }
.acct img { width: 48px; height: 48px; border-radius: 50%; border: 2px solid var(--line); flex: none; }
.acct div { min-width: 0; }
.scrhead { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: center; gap: 4px 16px; }
.worlds { display: flex; flex-direction: column; gap: 8px; width: 100%; }
.world h3 { margin: 0 0 4px; text-align: left; font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.lvgrid { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 5px; }
input[type="color"].picker { width: 34px; height: 30px; padding: 0 2px; border-radius: 8px; cursor: pointer; }
.swatch.auto { width: auto; border-radius: 15px; padding: 0 10px; font-size: 12px; }
.story-text { text-align: left; max-width: 62ch; display: flex; flex-direction: column; gap: 4px; }
.story-text h3 { margin: 6px 0 0; font-size: 13px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent); }
.story-text p { margin: 0; color: var(--ink); }
.toast { position: absolute; top: 14%; left: 50%; transform: translateX(-50%); width: max-content; max-width: 86%; padding: 8px 14px; border-radius: 10px; background: rgba(20, 16, 40, 0.88); color: #ffffff; font-weight: 600; text-align: center; pointer-events: none; }
.game:not(.can-dash) #tDash { display: none !important; }
.lv { display: flex; flex-direction: column; align-items: center; padding: 4px; min-width: 0; }
.lv b { font-size: clamp(14px, 2.3vw, 19px); line-height: 1.2; }
.lv .st { font-size: 12px; letter-spacing: 1px; color: #e0a800; }
:root[data-mode="halloween"] .lv .st { color: #ffd23f; }
.lv .tag { font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--good); }
.starlist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 3px; text-align: left; }
.starlist li { display: flex; gap: 10px; align-items: center; font-size: clamp(13px, 2vw, 16px); }
.starlist .s { font-size: 20px; color: var(--line); width: 1.2em; text-align: center; }
.starlist .s.on { color: #f0b400; }
.big-stars { font-size: clamp(26px, 5vw, 40px); color: #f0b400; letter-spacing: 4px; line-height: 1; }
.hero-grid { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px 18px; align-items: center; width: 100%; }
.hero-prev { width: 96px; height: 120px; image-rendering: pixelated; background: rgba(255, 255, 255, 0.35); border: 2px solid var(--line); border-radius: 12px; }
.hero-opts { display: flex; flex-direction: column; gap: 6px; align-items: stretch; min-width: 0; text-align: left; }
.hero-opts .row { justify-content: flex-start; }
.swatch { width: 30px; height: 30px; padding: 0; border-radius: 50%; }
.swatch[aria-checked="true"] { outline: 3px solid var(--ink); outline-offset: 2px; }
#heroName { width: 100%; max-width: 240px; }
@media (max-width: 560px) {
  .hero-grid { grid-template-columns: minmax(0, 1fr); justify-items: center; }
  .hero-opts .row { justify-content: center; }
}
</style>

</head>
<body>
<main class="wrap">
  <div class="game" id="gameBox">
  <div class="stage">
    <canvas id="game" width="1440" height="816" tabindex="0" aria-label="Saltamondo"></canvas>
    <button type="button" class="pausebtn" id="pauseBtn" hidden>Pausa</button>

    <div class="dialog" id="dialog" hidden>
      <canvas id="guideCanvas" width="24" height="24" aria-hidden="true"></canvas>
      <div class="txt">
        <p class="who">Gufo Saggio</p>
        <p class="say" id="dialogSay" aria-live="polite"></p>
        <p class="next" id="dialogNext"></p>
      </div>
    </div>

    <div class="menu" id="menu">
      <section class="scr" id="scrLogin" hidden>
        <h2 class="logo">Saltamondo</h2>
        <div class="acct">
          <img id="loginAvatar" alt="" hidden>
          <div>
            <p class="hello" id="loginName">Controllo il tuo account&hellip;</p>
            <p class="note" id="loginNote"></p>
          </div>
        </div>
        <div class="row">
          <button type="button" class="primary" id="btnLoginCloud" data-primary disabled>Accedi</button>
          <button type="button" id="btnLoginLocal">Gioca senza account</button>
        </div>
      </section>

      <section class="scr" id="scrTitle" hidden>
        <h2 class="logo" id="logo">Saltamondo</h2>
        <p class="hello" id="hello"></p>
        <div class="row seg" role="radiogroup" aria-label="Modalità">
          <button type="button" role="radio" id="mClassic" data-mode="classic">Classica</button>
          <button type="button" role="radio" id="mHalloween" data-mode="halloween">Halloween</button>
        </div>
        <div class="row seg" role="radiogroup" aria-label="Difficoltà">
          <button type="button" role="radio" id="dFacile" data-diff="facile">Facile</button>
          <button type="button" role="radio" id="dNormale" data-diff="normale">Normale</button>
          <button type="button" role="radio" id="dDifficile" data-diff="difficile">Difficile</button>
        </div>
        <p class="note" id="diffDesc"></p>
        <div class="row">
          <button type="button" class="primary" id="btnPlay" data-primary>Gioca</button>
          <button type="button" id="btnTutorial">Tutorial</button>
          <button type="button" id="btnHero">Personaggio</button>
          <button type="button" id="btnStory">Storia</button>
        </div>
        <div class="row">
          <button type="button" class="small" id="btnAccount">Account</button>
          <button type="button" class="small" id="btnSfx">Suoni: s&igrave;</button>
          <button type="button" class="small" id="btnMusic">Musica: s&igrave;</button>
          <button type="button" class="small" id="btnFull" hidden>Schermo intero</button>
        </div>
      </section>

      <section class="scr" id="scrHero" hidden>
        <h2 id="heroTitle">Il tuo personaggio</h2>
        <div class="hero-grid">
          <canvas class="hero-prev" id="heroCanvas" width="72" height="90" aria-label="Anteprima del personaggio"></canvas>
          <div class="hero-opts">
            <label class="lbl" for="heroName">Nome</label>
            <input id="heroName" maxlength="12" autocomplete="off" spellcheck="false" placeholder="Scrivi un nome">
            <span class="lbl">Personaggio</span>
            <div class="row seg" role="radiogroup" aria-label="Personaggio" id="bodySeg"></div>
            <span class="lbl">Colore</span>
            <div class="row seg" role="radiogroup" aria-label="Colore" id="colorSeg"></div>
            <span class="lbl">Colore dei dettagli</span>
            <div class="row seg" role="radiogroup" aria-label="Colore dei dettagli" id="color2Seg"></div>
            <span class="lbl">Cappello</span>
            <div class="row seg" role="radiogroup" aria-label="Cappello" id="hatSeg"></div>
            <div class="row seg" role="radiogroup" aria-label="Colore del cappello" id="hatColorSeg"></div>
            <span class="lbl">Accessorio</span>
            <div class="row seg" role="radiogroup" aria-label="Accessorio" id="accSeg"></div>
            <div class="row seg" role="radiogroup" aria-label="Colore dell'accessorio" id="accColorSeg"></div>
          </div>
        </div>
        <p class="note" id="heroNote"></p>
        <div class="row">
          <button type="button" class="primary" id="btnHeroSave" data-primary>Salva</button>
          <button type="button" id="btnHeroRandom">Casuale</button>
          <button type="button" id="btnHeroCancel">Annulla</button>
        </div>
      </section>

      <section class="scr" id="scrLevels" hidden>
        <div class="scrhead"><h2>Scegli il livello</h2><span class="lbl" id="starTotal"></span></div>
        <div class="row"><button type="button" id="btnTutorial2">Tutorial</button><span class="coin" id="lvCoins"></span></div>
        <div class="worlds" id="worlds"></div>
        <div class="row"><button type="button" id="btnBackTitle">Menu principale</button></div>
      </section>

      <section class="scr" id="scrPause" hidden>
        <h2>Pausa</h2>
        <div class="row">
          <button type="button" class="primary" id="btnResume" data-primary>Riprendi</button>
          <button type="button" id="btnRetry">Ricomincia il livello</button>
          <button type="button" id="btnPauseLevels">Livelli</button>
          <button type="button" id="btnSkip" hidden>Salta livello (admin)</button>
        </div>
        <p class="note" id="pauseInfo"></p>
      </section>

      <section class="scr" id="scrStory" hidden>
        <h2>La storia</h2>
        <div class="story-text" id="storyText"></div>
        <div class="row"><button type="button" class="primary" id="btnStoryBack" data-primary>Indietro</button></div>
      </section>

      <section class="scr" id="scrDone" hidden>
        <h2 id="doneTitle">Livello superato!</h2>
        <div class="big-stars" id="doneBig" aria-hidden="true"></div>
        <ul class="starlist" id="doneStars"></ul>
        <p class="hello" id="doneCoins"></p>
        <p class="hello" id="doneAbility" hidden></p>
        <div class="row">
          <button type="button" class="primary" id="btnNext" data-primary>Livello successivo</button>
          <button type="button" id="btnRetry2">Rigioca</button>
          <button type="button" id="btnDoneLevels">Livelli</button>
        </div>
      </section>

      <section class="scr" id="scrWin" hidden>
        <h2>Evviva!</h2>
        <p class="note" id="winText"></p>
        <div class="big-stars" id="winStars"></div>
        <div class="row"><button type="button" class="primary" id="btnWinLevels" data-primary>Livelli</button></div>
      </section>
    </div>
  </div>

  <div class="touch" aria-hidden="true">
    <div class="grp">
      <button type="button" id="tLeft" data-k="left">&#9664;</button>
      <button type="button" id="tRight" data-k="right">&#9654;</button>
    </div>
    <div class="grp">
      <button type="button" id="tDash" data-k="dash">&#187;</button>
      <button type="button" id="tDown" data-k="down">&#9660;</button>
      <button type="button" id="tJump" class="big" data-k="jump">&#9650;</button>
    </div>
  </div>
  <p class="rotate">Gira il telefono in orizzontale per giocare più comodo.</p>
  <div class="toast" id="toast" role="status" hidden></div>
  </div>
</main>

<script>
(() => {
  'use strict';

  // ================= costanti =================
  const T = 16, VW = 480, VH = 272, ROWS = 17;
  const GRAV = 1300, RUN = 140, JUMP = 430, DJUMP = 380, SPRING = 700, MAXFALL = 480, STOMP = 340, PGRAV = 900;
  const COST = 500, STAND_H = 15, CROUCH_H = 8, SLIDE_V = 240, DASH_V = 320;
  const LPW = 6, TOTAL = 18;   // livelli per mondo e livelli per modalita'
  const WALL_SLIDE = 80, POUND_V = 700;
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const cv = document.getElementById('game');
  const mainCtx = cv.getContext('2d');
  let ctx = mainCtx;

  const DIFFS = {
    facile:    { label: 'Facile',    hearts: 5, mult: 0.75, crumble: 0.6,  cpEvery: 3, coyote: 0.14, hpIdx: 0, heartChunk: true,  failToCheckpoint: true,
                 desc: '5 cuori, nemici lenti e tanti punti di ripartenza. Perfetto per i più piccoli.' },
    normale:   { label: 'Normale',   hearts: 3, mult: 1.0,  crumble: 0.45, cpEvery: 4, coyote: 0.1,  hpIdx: 1, heartChunk: true,  failToCheckpoint: true,
                 desc: '3 cuori. Se li perdi tutti, riparti dall’ultima bandierina con i cuori pieni.' },
    difficile: { label: 'Difficile', hearts: 2, mult: 1.3,  crumble: 0.3,  cpEvery: 6, coyote: 0.08, hpIdx: 2, heartChunk: false, failToCheckpoint: true,
                 desc: '2 cuori, nemici veloci e assi che crollano subito. Se cadi riparti dalla bandierina.' }
  };

  // ================= sprite (mappe di pixel, guardano a destra) =================
  const K = '#2a1e2e';
  const SPR = {
    lumaca: { pal: { c: '#c0602a', d: '#f09a4a', y: '#b8d86a', e: K }, map: [

  function mulberry32(a) {
    return () => {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function blankGrid(w) { const g = []; for (let y = 0; y < ROWS; y++) g.push(new Array(w).fill(' ')); return g; }

  // Mappe casuali: a ogni partita il livello cambia (pezzi diversi, a volte specchiati, monete e nemici in piu').
  function buildLevel(mode, n, dk, seed) {
    const D = DIFFS[dk], rng = mulberry32(seed);
    const world = Math.floor(n / LPW), isBoss = n % LPW === LPW - 1;
    const prog = n / (TOTAL - 1);
    const maxTier = Math.min(4, 1 + Math.floor(prog * 4.4 + 0.4));
    const count = isBoss ? 3 + world * 2 + Math.floor(rng() * 2) : 5 + Math.floor(prog * 9) + Math.floor(rng() * 4);
    const pool = CHUNKS.filter(c => c.tier <= maxTier && (c.minN || 0) <= n);
    const pieces = [SPECIAL.start];
    const recent = [];
    for (let i = 0; i < count; i++) {
      let total = 0;
      const ws = pool.map(c => { const w = recent.includes(c) ? 0 : c.tier === maxTier ? 3 : c.tier === maxTier - 1 ? 2 : 1; total += w; return w; });
      let r = rng() * total, chosen = pool[0];
      for (let k = 0; k < pool.length; k++) { r -= ws[k]; if (r <= 0) { chosen = pool[k]; break; } }
      recent.push(chosen); if (recent.length > 2) recent.shift();
      const mirror = !/[MV]/.test(chosen.rows.join('')) && rng() < 0.5;
      pieces.push(mirror ? { id: chosen.id, w: chosen.w, rows: chosen.rows.map(row => [...row].reverse().join('')) } : chosen);
      if (D.heartChunk && i === Math.floor(count / 2)) pieces.push(SPECIAL.heart);
      if ((i + 1) % D.cpEvery === 0 && i < count - 1) pieces.push(SPECIAL.check);
    }
    if (isBoss) pieces.push(SPECIAL.check, SPECIAL.arena);
    pieces.push(SPECIAL.end);
    const w = pieces.reduce((s2, p2) => s2 + p2.w, 0);
    const grid = blankGrid(w);
    let ox = 0, arena = null;
    for (const p2 of pieces) {
      if (p2 === SPECIAL.arena) arena = { x0: ox, x1: ox + 24 };
      const off = ROWS - p2.rows.length;
      p2.rows.forEach((row, ry) => {
        for (let x = 0; x < p2.w; x++) {
          const c = row[x] || '.';
          grid[off + ry][ox + x] = c === '.' ? ' ' : c;
        }
      });
      ox += p2.w;
    }
    // un po' di sorprese: monete sospese e qualche nemico in piu' sui tratti piatti
    const stop = arena ? arena.x0 - 2 : w - 14;
    for (let x = 10; x < stop; x++) {
      const flat = grid[14][x] === '#' && grid[13][x] === ' ' && grid[12][x] === ' ' && grid[11][x] === ' ';
      if (!flat) continue;
      const roll = rng();
      if (roll < 0.07) { grid[11 - Math.floor(rng() * 2)][x] = 'c'; }
      else if (roll < 0.085 + world * 0.008 && grid[14][x - 2] === '#' && grid[14][x + 2] === '#') grid[13][x] = 'p';
    }
    for (let x = 0; x < w; x++) {
      const top = grid.findIndex(r2 => r2[x] === 'G');
      if (top > 0) for (let y = 0; y < top; y++) grid[y][x] = 'G';
    }
    return { grid, w, world, isBoss, arena, tips: [] };
  }

  // Tutorial: un livello normale. Ogni volta che arriva una cosa nuova il gioco si ferma e il Gufo Saggio spiega.
  function buildTutorial() {
    const w = 128, grid = blankGrid(w);
    const put = (x, y, c) => { if (x >= 0 && x < w && y >= 0 && y < ROWS) grid[y][x] = c; };
    const rect = (x0, y0, x1, y1, c) => { for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) put(x, y, c); };
    const tips = [];
    const tip = (x, i) => tips.push({ x: x * T, i });
    rect(0, 14, 21, 16, '#'); put(2, 13, 'P'); tip(3, 0);
    tip(10, 1); rect(14, 12, 15, 13, '#');
    tip(18, 2);
    rect(25, 14, 127, 16, '#');
    tip(27, 3); put(31, 13, '#'); put(35, 13, '#'); put(39, 13, '#');
    tip(43, 4); rect(47, 8, 49, 13, '#'); put(48, 7, 'c');
    tip(52, 5); for (let x = 54; x <= 61; x += 2) put(x, 13, 'c');
    tip(63, 6); rect(67, 6, 71, 11, '#'); rect(67, 12, 71, 12, 'u'); for (let x = 68; x <= 70; x++) put(x, 13, 'c');
    tip(73, 7); rect(76, 6, 87, 11, '#'); rect(76, 12, 87, 12, 'u');
    tip(90, 8); put(95, 13, 'p');
    tip(99, 9); put(102, 13, '^'); put(103, 13, '^');
    tip(106, 10); put(109, 13, 'S'); rect(111, 6, 116, 6, '='); for (let x = 112; x <= 115; x++) put(x, 5, 'c');
    put(119, 13, 'C'); tip(118, 11);
    tip(121, 12); put(125, 13, 'L');
    return { grid, w, world: 0, isBoss: false, arena: null, tips };
  }

  // ================= salvataggio =================
  const SAVE_KEY = 'saltamondo-save-v1';
  function emptyStars() { return { facile: [], normale: [], difficile: [] }; }
  function normalize(s) {
    const d = { hero: null, coins: 0, mode: 'classic', diff: 'normale', unlocked: { classic: 1, halloween: 1 },
      stars: { classic: emptyStars(), halloween: emptyStars() }, sfx: true, music: true, tutorialDone: false,
      seen: [], cloudChoice: null, updatedAt: 0, v6: true,
      abilities: { dash: false, wall: false, pound: false }, story: {}, pendingMsgs: [], admin: false, adminBackup: null };
    if (!s || typeof s !== 'object') return d;
    const n = { ...d, ...s, unlocked: { ...d.unlocked, ...(s.unlocked || {}) },
      stars: { classic: { ...emptyStars(), ...((s.stars || {}).classic || {}) }, halloween: { ...emptyStars(), ...((s.stars || {}).halloween || {}) } },
      seen: Array.isArray(s.seen) ? s.seen.slice() : [] };
    if (!DIFFS[n.diff]) n.diff = 'normale';
    if (!MODES[n.mode]) n.mode = 'classic';
    if (!(n.coins >= 0)) n.coins = 0;
    n.abilities = { ...d.abilities, ...(s.abilities || {}) };
    n.story = { ...(s.story || {}) };
    n.pendingMsgs = Array.isArray(s.pendingMsgs) ? s.pendingMsgs.slice() : [];
    if (!s.v6) {
      // i salvataggi vecchi avevano 4 livelli per mondo
      const conv = i => Math.floor(i / 4) * LPW + (i % 4 === 3 ? LPW - 1 : i % 4);
      for (const m of ['classic', 'halloween']) {
        const u = n.unlocked[m] || 1;
        n.unlocked[m] = Math.min(TOTAL, conv(Math.max(0, u - 1)) + 1);
        for (const dk of Object.keys(n.stars[m])) {
          const nw = [];
          (n.stars[m][dk] || []).forEach((v, i) => { if (v) nw[conv(i)] = v; });
          n.stars[m][dk] = nw;
        }
        if (u > 3) n.abilities.pound = true;
        if (u > 4) n.abilities.dash = true;
        if (u > 8) n.abilities.wall = true;
      }
      n.v6 = true;
    }
    return n;
  }
  function loadSave() {

  }

  function applySave(s) {
    const n = normalize(s);

  const cloud = { ready: false, status: 'checking', db: null, me: null, uid: null, on: false, ref: null, writing: false, dirty: false, timer: 0, error: '' };
  function persist() {
    save.updatedAt = Date.now();

    if (cloud.on) { clearTimeout(cloud.timer); cloud.timer = setTimeout(pushCloud, 1500); }
  }
  async function pushCloud() {
    if (!cloud.on || !cloud.ref) return;
    if (cloud.writing) { cloud.dirty = true; return; }
    cloud.writing = true;
    try {
      await cloud.ref.set({ save: JSON.parse(JSON.stringify(save)), v: 1 });
      cloud.error = '';
    } catch (e) {
      cloud.error = e && e.code === 'invalid_argument' ? 'readonly' : 'retry';
    }
    cloud.writing = false;
    if (cloud.dirty) { cloud.dirty = false; pushCloud(); }
    if (state === 'title') renderTitle();
  }

    if (cloud.status !== 'available') return false;
    try {
      const ref = cloud.db.doc(`data/users/${cloud.uid}/saltamondo`);
      const snap = await ref.get();
      const remote = snap.exists ? snap.data().save : null;
      if (remote && (remote.updatedAt || 0) >= (save.updatedAt || 0)) applySave(remote);
      cloud.ref = ref; cloud.on = true; cloud.error = '';
      save.cloudChoice = 'cloud';
      persist();
      return true;
    } catch (e) {
      cloud.error = 'retry';

  function note(freq, when, dur, type, vol, slideTo) {

  let state = 'title';
  let curLevel = 0, D = DIFFS[save.diff], lv = null, P = null;
  let cam = 0, t = 0, shake = 0, timer = 0, hitstop = 0, flash = 0;
  let particles = [], bubbles = [], heartFx = [];
  let death = null, iris = null, lastResult = null, tip = null, tipTick = 0, jumpLock = false;
  const inGame = () => state === 'play' || state === 'dying' || state === 'clear' || state === 'tip';
  const worldsOf = mode => MODES[mode].worlds;

  function mkEnemy(kindKey, tx, ty, rng) {
    const k = KINDS[kindKey];
    const e = { kind: kindKey, k, w: k.w, h: k.h, x: tx * T + (T - k.w) / 2, y: ty * T + T - k.h, vx: 0, vy: 0, dir: -1,
      alive: true, onGround: false, t: 0, ph: rng ? rng() : Math.random(), timer: 0, cool: 1 + (rng ? rng() : 0), st: 'ok', shy: false, said: 0, spikes: true };
    if (k.beh === 'flyer' || k.beh === 'swooper') { e.y = ty * T + 4; e.bx = e.x; e.by = e.y; e.st = 'hover'; }
    if (k.beh === 'popper') { e.st = 'down'; e.gy = e.y; }
    if (k.beh === 'dropper') { e.gy = e.y; e.top = 28; e.y = e.top; e.st = 'top'; }
    if (k.beh === 'hopper') e.timer = 0.6 + e.ph;
    return e;
  }

  function loadLevel(n) {
    const mode = save.mode;
    const tutorial = n < 0;
    const built = tutorial ? buildTutorial() : buildLevel(mode, n, save.diff, (Math.random() * 1e9) | 0);
    const wdef = worldsOf(mode)[built.world];
    const rng = mulberry32(99 + n);
    const L = {
      n, tutorial, mode, wdef, theme: THEMES[wdef.theme], themeKey: wdef.theme, world: built.world,
      name: tutorial ? 'Tutorial' : wdef.levels[n % LPW], w: built.w, grid: built.grid, arena: built.arena,
      coins: [], loose: [], hearts: [], checks: [], enemies: [], plats: [], projs: [], queue: [], tips: built.tips.map(x => ({ ...x, done: false })),
      springs: new Map(), crumble: new Map(), door: null, start: { tx: 2, ty: 13 }, boss: null,
      got: 0, hits: 0, earned: 0, introT: 2.2, doorOpen: 0
    };
    const g = L.grid;
    for (let y = 0; y < ROWS; y++) for (let x = 0; x < L.w; x++) {
      const c = g[y][x];
      if ('PchCLMVpkbjgZ'.includes(c)) g[y][x] = ' ';
      if (c === 'P') L.start = { tx: x, ty: y };
      else if (c === 'c') L.coins.push({ x: x * T + 8, y: y * T + 8, ph: rng() * 6, got: false, col: L.coins.length % 4 });
      else if (c === 'h') L.hearts.push({ x: x * T + 8, y: y * T + 8, got: false });
      else if (c === 'C') L.checks.push({ tx: x, ty: y, lit: false });
      else if (c === 'L') L.door = { tx: x, ty: y };
      else if (c === 'M') L.plats.push({ axis: 'x', x: x * T, y: y * T, w: 48, h: 6, a: x * T, b: x * T + 128, dir: 1, wait: 0, dx: 0, dy: 0 });
      else if (c === 'V') L.plats.push({ axis: 'y', x: x * T, y: y * T, w: 48, h: 6, a: y * T, b: y * T - 80, dir: -1, wait: 0, dx: 0, dy: 0 });
      else if (c === 'Z') L.boss = mkBoss(wdef.boss, x, y);
      else if ('pkbjg'.includes(c)) L.enemies.push(mkEnemy(tutorial ? 'lumaca' : wdef.enemies[c], x, y, rng));
    }
    L.total = L.coins.length;
    lv = L;
    L.tiles = renderTiles(L);
    L.respawn = { x: L.start.tx * T + 3, y: L.start.ty * T + T - 15 };
    P = { x: L.respawn.x, y: L.respawn.y, w: 11, h: STAND_H, vx: 0, vy: 0, onGround: false, coyote: 0, jumpBuf: 0, slide: 0, drop: 0, dash: 0, dashCool: 0, dashUsed: false, pound: 0,
      face: 1, anim: 0, inv: 0, knock: 0, ride: null, hearts: D.hearts, canDouble: true, sx: 1, sy: 1, rot: 0 };
    cam = clamp(P.x - VW / 2 + 40, 0, L.w * T - VW);
    particles = []; bubbles = []; heartFx = []; death = null; iris = { t: 0.45, max: 0.45 };
  }

  function mkBoss(key, tx, ty) {
    const def = BOSSES[key];
    const hp = def.hp[D.hpIdx];
    return { def, key, x: tx * T - def.w / 2, y: ty * T + 16 - def.h, w: def.w, h: def.h, vx: 0, vy: 0, dir: -1, onGround: false,
      hp, maxHp: hp, inv: 0, state: 'sleep', t: 0, ai: 0, next: null, landKind: null, bombT: 0, defeated: false, alive: true };
  }

  // ================= utilita' =================
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const overlap = (a, bx, by, bw, bh) => a.x < bx + bw && a.x + a.w > bx && a.y < by + bh && a.y + a.h > by;
  const pick = a => a[Math.floor(Math.random() * a.length)];
  const hash = (a, b, c = 0) => {
    let h = (a * 374761393 + b * 668265263 + c * 1442695041) | 0;
    h = (h ^ (h >>> 13)) * 1274126177;
    return (h ^ (h >>> 16)) >>> 0;
  };

  function tile(tx, ty) {
    if (ty < 0 || ty >= ROWS) return ' ';
    if (tx < 0 || tx >= lv.w) return '#';
    const c = lv.grid[ty][tx];
    if (c === '-') { const s = lv.crumble.get(ty * lv.w + tx); if (s && s.state === 'gone') return ' '; }
    return c;
  }
  const isSolid = c => c === '#' || c === 'G' || c === 'u' || c === 'X';
  const standable = c => isSolid(c) || c === '=' || c === '-';
  // I blocchi bassi 'u' sporgono 8 pixel nella casella sotto: per passare bisogna abbassarsi.
  function extRects(e) {
    const out = [];
    const l = Math.floor(e.x / T), r = Math.floor((e.x + e.w - 0.01) / T);
    const top = Math.floor(e.y / T) - 1, bot = Math.floor((e.y + e.h - 0.01) / T);
    for (let ty = top; ty <= bot; ty++) for (let tx = l; tx <= r; tx++) {
      if (tile(tx, ty) === 'u' && overlap(e, tx * T, ty * T + T, T, 8)) out.push({ x: tx * T, y: ty * T + T });
    }
    return out;
  }
  function boxFree(b) {
    const l = Math.floor(b.x / T), r = Math.floor((b.x + b.w - 0.01) / T);
    const tp = Math.floor(b.y / T), bt = Math.floor((b.y + b.h - 0.01) / T);
    for (let ty = tp; ty <= bt; ty++) for (let tx = l; tx <= r; tx++) if (isSolid(tile(tx, ty))) return false;
    return extRects(b).length === 0;
  }

  function collideX(e) {
    const top = Math.floor(e.y / T), bot = Math.floor((e.y + e.h - 0.01) / T);
    if (e.vx > 0) {
      const tx = Math.floor((e.x + e.w - 0.01) / T);
      for (let ty = top; ty <= bot; ty++) if (isSolid(tile(tx, ty))) { e.x = tx * T - e.w; e.vx = 0; return true; }
    } else if (e.vx < 0) {
      const tx = Math.floor(e.x / T);
      for (let ty = top; ty <= bot; ty++) if (isSolid(tile(tx, ty))) { e.x = (tx + 1) * T; e.vx = 0; return true; }
    }
    return false;
  }

  function collideY(e, prevBottom, drop, isPlayer) {
    e.onGround = false;
    let spring = null;
    const l = Math.floor(e.x / T), r = Math.floor((e.x + e.w - 0.01) / T);
    if (e.vy > 0) {
      const ty = Math.floor((e.y + e.h - 0.01) / T);
      for (let tx = l; tx <= r; tx++) {
        const c = tile(tx, ty);
        const oneWay = (c === '=' || c === '-') && !drop && prevBottom <= ty * T + 0.01;
        if (isSolid(c) || oneWay) {
          e.y = ty * T - e.h; e.vy = 0; e.onGround = true;
          if (c === 'S') spring = { tx, ty };
          if (c === '-' && isPlayer) touchCrumble(tx, ty);
        }
      }
    } else if (e.vy < 0) {
      const ty = Math.floor(e.y / T);
      for (let tx = l; tx <= r; tx++) if (isSolid(tile(tx, ty))) { e.y = (ty + 1) * T; e.vy = 0; break; }
    }
    return spring;
  }

  function touchCrumble(tx, ty) {
    const k = ty * lv.w + tx;
    if (!lv.crumble.has(k)) lv.crumble.set(k, { tx, ty, state: 'shake', t: D.crumble });
  }

  function emit(x, y, n, col, spd, grav, life) {
    if (reduceMotion) n = Math.ceil(n / 3);
    for (let i = 0; i < n; i++) particles.push({ x, y, vx: (Math.random() - 0.5) * spd * 2, vy: (Math.random() - 0.75) * spd, life, max: life, col, g: grav });
  }
  function bubble(ent, text, life = 1.3) {
    bubbles = bubbles.filter(b => b.ent !== ent);
    bubbles.push({ ent, text, life, max: life, x: ent.x + ent.w / 2, y: ent.y });
  }
  function addCoins(n) { save.coins += n; lv.earned += n; persist(); }

  // ================= aggiornamento =================
  function update(dt) {
    t += dt;
    for (const p of particles) { p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; }
    particles = particles.filter(p => p.life > 0);
    for (const b of bubbles) { b.life -= dt; if (b.ent) { b.x = b.ent.x + b.ent.w / 2; b.y = b.ent.y; } }
    bubbles = bubbles.filter(b => b.life > 0);
    for (const h of heartFx) h.t += dt;
    heartFx = heartFx.filter(h => h.t < 1);
    for (const [k, s] of lv.springs) { const v = s - dt * 3; if (v <= 0) lv.springs.delete(k); else lv.springs.set(k, v); }
    if (iris) { iris.t -= dt; if (iris.t <= 0) iris = null; }
    flash = Math.max(0, flash - dt);
    if (state === 'tip') { updateTip(dt); jumpPressed = false; return; }

    if (state === 'title' || state === 'levels' || state === 'hero' || state === 'login' || state === 'story') {
      cam = (Math.sin(t * (reduceMotion ? 0.03 : 0.08)) * 0.5 + 0.5) * (lv.w * T - VW);
      jumpPressed = false;
      return;
    }
    if (!inGame()) { jumpPressed = false; return; }
    if (hitstop > 0) { hitstop -= dt; jumpPressed = false; return; }

    if (state === 'dying') { updateDeath(dt); jumpPressed = false; return; }

    lv.introT = Math.max(0, lv.introT - dt);
    P.inv = Math.max(0, P.inv - dt);
    updatePlatforms(dt);
    updateCrumbles(dt);
    updateEnemies(dt);
    if (lv.boss) updateBoss(lv.boss, dt);
    updateProjectiles(dt);
    updateLoose(dt);

    if (state === 'play') { updatePlayer(dt); if (state === 'play' && ++tipTick % 8 === 0) checkTips(); }
    else if (state === 'clear') {
      timer -= dt;
      lv.doorOpen = Math.min(1, lv.doorOpen + dt * 3);
      if (timer <= 0) levelDone();
    }

    if (state === 'play' || state === 'clear') {
      const target = P.x + P.w / 2 - VW / 2 + P.face * 40;
      cam += (target - cam) * Math.min(1, dt * 5);
      cam = clamp(cam, 0, lv.w * T - VW);
    }
    jumpPressed = false;
  }

  function updatePlatforms(dt) {
    const sp = 42 * (D.mult > 1 ? 1.15 : 1);
    for (const p of lv.plats) {
      const px0 = p.x, py0 = p.y;
      if (p.wait > 0) p.wait -= dt;
      else if (p.axis === 'x') {
        p.x += p.dir * sp * dt;
        if (p.x >= p.b) { p.x = p.b; p.dir = -1; p.wait = 0.5; }
        if (p.x <= p.a) { p.x = p.a; p.dir = 1; p.wait = 0.5; }
      } else {
        p.y += p.dir * sp * dt;
        if (p.y <= p.b) { p.y = p.b; p.dir = 1; p.wait = 0.8; }
        if (p.y >= p.a) { p.y = p.a; p.dir = -1; p.wait = 0.8; }
      }
      p.dx = p.x - px0; p.dy = p.y - py0;
    }
  }

  function updateCrumbles(dt) {
    for (const [k, s] of lv.crumble) {
      s.t -= dt;
      if (s.state === 'shake' && s.t <= 0) {
        s.state = 'gone'; s.t = 3;
        sfx.crack();
        emit(s.tx * T + 8, s.ty * T + 3, 8, lv.theme.plank[0], 50, 300, 0.6);
      } else if (s.state === 'gone' && s.t <= 0 && !overlap(P, s.tx * T, s.ty * T, T, T)) {
        lv.crumble.delete(k);
      }
    }
  }

  function walker(e, speed, dt) {
    e.vx = e.dir * speed;
    e.vy = Math.min(MAXFALL, e.vy + GRAV * dt);
    e.x += e.vx * dt;
    if (collideX(e)) e.dir *= -1;
    if (extRects(e).length) { e.x -= e.vx * dt; e.dir *= -1; }
    const pb = e.y + e.h;
    e.y += e.vy * dt;
    collideY(e, pb, false, false);
    if (e.onGround) {
      const fx = e.dir > 0 ? e.x + e.w + 1 : e.x - 1;
      if (!standable(tile(Math.floor(fx / T), Math.floor((e.y + e.h + 2) / T)))) { e.dir *= -1; return true; }
    }
    if (e.y > VH + 40) e.alive = false;
    return false;
  }

  function throwAt(x, y, tx, ty, kind, flight = 0.9) {
    const vx = (tx - x) / flight;
    const vy = (ty - y) / flight - 0.5 * PGRAV * flight;
    lv.projs.push({ kind, x, y, vx, vy, grav: PGRAV, life: 4, t: 0, r: PROJ[kind].r });
    sfx.throw();
  }

  function updateEnemies(dt) {
    const m = D.mult;
    const pcx = P.x + P.w / 2, pcy = P.y + P.h / 2;
    for (const e of lv.enemies) {
      e.t += dt;
      const k = e.k;
      if (!e.alive) {
        e.timer -= dt;
        if (k.reassemble && e.timer <= 0 && !overlap(P, e.x - 2, e.y - 2, e.w + 4, e.h + 4)) { e.alive = true; bubble(e, 'Eccomi!'); }
        continue;
      }
      const dx = pcx - (e.x + e.w / 2), dy = pcy - (e.y + e.h / 2);
      switch (k.beh) {
        case 'walker': walker(e, k.speed * m, dt); break;
        case 'spiky':
          walker(e, k.speed * m, dt);
          e.timer -= dt;
          if (e.timer <= 0) { e.spikes = !e.spikes; e.timer = e.spikes ? 1.8 / m : 1.3; }
          break;
        case 'charger': {
          e.cool -= dt;
          if (e.st === 'dash') {
            e.timer -= dt;
            const turned = walker(e, k.speed * 4 * m, dt);
            if (Math.random() < 0.3) emit(e.x + e.w / 2, e.y + e.h, 1, '#ffffff', 20, 0, 0.3);
            if (e.timer <= 0 || turned) { e.st = 'ok'; e.cool = 1.4; }
          } else if (e.st === 'wind') {
            e.timer -= dt;
            if (e.timer <= 0) { e.st = 'dash'; e.timer = 1.0; }
          } else {
            walker(e, k.speed * m, dt);
            if (e.cool <= 0 && Math.abs(dy) < 20 && Math.abs(dx) < 130 && Math.sign(dx) === e.dir) {
              e.st = 'wind'; e.timer = 0.35; bubble(e, '!', 0.5);
            }
          }
          break;
        }
        case 'static': e.y += Math.sin(e.t * 3) * 0.15; break;
        case 'hopper': {
          e.vy = Math.min(MAXFALL, e.vy + GRAV * dt);
          if (e.onGround) {
            e.vx = 0;
            e.timer -= dt;
            if (e.timer <= 0) { e.dir = Math.sign(dx) || 1; e.vx = e.dir * 50 * m; e.vy = -k.jump; e.timer = 1.3 / m; }
          }
          e.x += e.vx * dt;
          if (collideX(e)) e.vx = 0;
          const pb = e.y + e.h;
          e.y += e.vy * dt;
          collideY(e, pb, false, false);
          if (e.y > VH + 40) e.alive = false;
          break;
        }
        case 'flyer': {
          const a = e.t * 1.4 * m + e.ph * 6;
          e.x = e.bx + Math.sin(a) * 40;
          e.y = e.by + Math.sin(e.t * 3 + e.ph * 6) * 10;
          e.dir = Math.cos(a) > 0 ? 1 : -1;
          break;
        }
        case 'swooper': {
          e.cool -= dt;
          if (e.st === 'hover') {
            e.x = e.bx + Math.sin(e.t * 1.2 + e.ph * 6) * 20;
            e.y = e.by + Math.sin(e.t * 3) * 4;
            e.dir = dx > 0 ? 1 : -1;
            if (e.cool <= 0 && Math.abs(dx) < 120 && dy > 10 && dy < 160) {
              e.st = 'dive'; e.timer = 0.9;
              const d = Math.hypot(dx, dy) || 1, sp = 170 * m;
              e.vx = dx / d * sp; e.vy = dy / d * sp;
            }
          } else if (e.st === 'dive') {
            e.timer -= dt;
            e.x += e.vx * dt; e.y += e.vy * dt;
            if (e.timer <= 0 || e.y > VH - 30) e.st = 'back';
          } else {
            const bx = e.bx - e.x, by = e.by - e.y, d = Math.hypot(bx, by);
            if (d < 3) { e.st = 'hover'; e.cool = 1.6 / m; }
            else { e.x += bx / d * 70 * dt; e.y += by / d * 70 * dt; e.dir = bx > 0 ? 1 : -1; }
          }
          break;
        }
        case 'thrower': {
          e.vy = Math.min(MAXFALL, e.vy + GRAV * dt);
          const pb = e.y + e.h;
          e.y += e.vy * dt;
          collideY(e, pb, false, false);
          e.dir = dx > 0 ? 1 : -1;
          e.cool -= dt;
          if (e.cool <= 0 && Math.abs(dx) < 210 && Math.abs(dy) < 120 && state === 'play') {
            throwAt(e.x + e.w / 2, e.y + 2, pcx, P.y + P.h, k.proj, 0.85);
            e.cool = 2.4 / m;
            e.st = 'throw'; e.timer = 0.25;
          }
          if (e.st === 'throw') { e.timer -= dt; if (e.timer <= 0) e.st = 'ok'; }
          break;
        }
        case 'popper': {
          e.cool -= dt;
          if (e.st === 'down') { if (e.cool <= 0 && Math.abs(dx) < 60 && Math.abs(dy) < 40) { e.st = 'rise'; e.timer = 0.25; } }
          else if (e.st === 'rise') { e.timer -= dt; if (e.timer <= 0) { e.st = 'up'; e.timer = 1.3 / m; bubble(e, 'Cucu!', 0.6); } }
          else if (e.st === 'up') { e.timer -= dt; e.dir = dx > 0 ? 1 : -1; if (e.timer <= 0) { e.st = 'down'; e.cool = 1.4; } }
          break;
        }
        case 'shy': {
          const dist = Math.hypot(dx, dy);
          const looked = Math.sign(-dx) === P.face;
          if (dist < 220 && looked) {
            if (!e.shy && t - e.said > 2.5) { bubble(e, pick(['Ih!', 'Non guardarmi!', 'Che vergogna!'])); e.said = t; }
            e.shy = true;
          } else {
            e.shy = false;
            if (dist < 220 && dist > 1 && state === 'play') {
              const sp = 34 * m;
              e.x += dx / dist * sp * dt; e.y += dy / dist * sp * dt;
              e.dir = dx > 0 ? 1 : -1;
            }
          }
          e.y = clamp(e.y, 8, VH - 40);
          break;
        }
        case 'dropper': {
          if (e.st === 'top') { if (Math.abs(dx) < 26 && dy > 0) { e.st = 'drop'; e.vy = 0; } }
          else if (e.st === 'drop') { e.vy += GRAV * dt; e.y += e.vy * dt; if (e.y >= e.gy) { e.y = e.gy; e.st = 'bottom'; e.timer = 0.8; } }
          else if (e.st === 'bottom') { e.timer -= dt; if (e.timer <= 0) e.st = 'climb'; }
          else { e.y -= 60 * m * dt; if (e.y <= e.top) { e.y = e.top; e.st = 'top'; } }
          break;
        }
      }
    }
  }

  function canStomp(e) {
    const k = e.k;
    if (k.stomp === false) return false;
    if (k.beh === 'spiky' && e.spikes) return false;
    if (k.beh === 'popper' && e.st !== 'up') return false;
    return true;
  }
  function canHurt(e) {
    if (e.k.beh === 'popper') return e.st === 'up';
    return true;
  }

  function updateProjectiles(dt) {
    for (const p of lv.projs) {
      p.t += dt; p.life -= dt;
      if (p.kind === 'onda') {
        p.x += p.vx * dt;
        if (lv.arena && (p.x < lv.arena.x0 * T || p.x > lv.arena.x1 * T)) p.life = 0;
      } else if (p.kind === 'ghiacciolo') {
        if (p.t > 0.75) { p.vy += PGRAV * dt; p.y += p.vy * dt; }
        if (p.y > p.gy) { p.life = 0; emit(p.x, p.gy, 6, '#dff6ff', 60, 300, 0.4); }
      } else if (p.kind === 'bolla') {
        if (p.t > 0) { p.x += p.vx * dt; p.y = p.by + Math.sin(p.t * 3) * 12; }
      } else {
        p.vy += p.grav * dt; p.x += p.vx * dt; p.y += p.vy * dt;
        if (isSolid(tile(Math.floor(p.x / T), Math.floor((p.y + p.r) / T))) || p.y > VH) {
          p.life = 0;
          if (p.kind === 'bomba') {
            emit(p.x, p.y, 16, '#ffb347', 120, 200, 0.5); sfx.boom();
            if (Math.hypot(P.x + P.w / 2 - p.x, P.y + P.h / 2 - p.y) < 30) hurt(PROJ.bomba.name, p);
          } else emit(p.x, p.y, 5, PROJ[p.kind].col, 50, 200, 0.3);
        }
      }
      if (p.life > 0 && state === 'play' && P.inv <= 0) {
        let hit;
        if (p.kind === 'onda') hit = overlap(P, p.x - 7, p.gy - 12, 14, 12);
        else if (p.kind === 'ghiacciolo') hit = p.t > 0.75 && overlap(P, p.x - 3, p.y, 6, 12);
        else if (p.kind === 'bolla') hit = p.t > 0 && Math.hypot(P.x + P.w / 2 - p.x, P.y + P.h / 2 - p.y) < p.r + 6;
        else hit = Math.hypot(P.x + P.w / 2 - p.x, P.y + P.h / 2 - p.y) < p.r + 6;
        if (hit) { p.life = 0; hurt(PROJ[p.kind].name, p); }
      }
    }
    lv.projs = lv.projs.filter(p => p.life > 0);
  }

  function updateLoose(dt) {
    for (const c of lv.loose) {
      c.vy = Math.min(MAXFALL, c.vy + GRAV * dt);
      const e = { x: c.x - 4, y: c.y - 4, w: 8, h: 8, vx: c.vx, vy: c.vy };
      e.x += c.vx * dt;
      if (collideX(e)) c.vx = -c.vx * 0.5;
      const pb = e.y + e.h;
      e.y += c.vy * dt;
      collideY(e, pb, false, false);
      c.x = e.x + 4; c.y = e.y + 4;
      if (e.onGround) { c.vy = -Math.abs(c.vy) * 0.3; c.vx *= 0.8; }
      c.life -= dt;
    }
    lv.loose = lv.loose.filter(c => c.life > 0 && !c.got);
  }

  // ---------- boss ----------
  function bossSpeed(b) { return D.mult * (b.hp <= b.maxHp / 2 ? 1.15 : 1); }

  function bossPhysics(b, dt) {
    b.vy = Math.min(MAXFALL, b.vy + GRAV * dt);
    b.x += b.vx * dt;
    let wall = collideX(b);
    if (lv.arena) {
      const x0 = lv.arena.x0 * T, x1 = lv.arena.x1 * T - b.w;
      if (b.x < x0) { b.x = x0; wall = true; }
      if (b.x > x1) { b.x = x1; wall = true; }
    }
    const pb = b.y + b.h, was = b.onGround;
    b.y += b.vy * dt;
    collideY(b, pb, false, false);
    return { wall, landed: b.onGround && !was };
  }

  function updateBoss(b, dt) {
    if (b.defeated) { b.x += 150 * dt; b.y = Math.min(b.y + 60 * dt, VH); return; }
    b.inv = Math.max(0, b.inv - dt);
    b.t -= dt;
    const sp = bossSpeed(b);
    const pcx = P.x + P.w / 2;
    if (b.state === 'sleep') {
      bossPhysics(b, dt);
      if (state === 'play' && lv.arena && P.x > lv.arena.x0 * T + 24) {
        b.state = 'idle'; b.t = 2.4;
        bubble(b, b.def.lines.intro(heroOr().name), 2.6);
      }
      return;
    }
    switch (b.state) {
      case 'idle': {
        b.vx = 0;
        const r = bossPhysics(b, dt);
        if (r.landed) landFx(b, 'small');
        b.dir = pcx > b.x + b.w / 2 ? 1 : -1;
        if (b.t <= 0 && b.onGround && state === 'play') nextAttack(b, sp);
        break;
      }
      case 'air': {
        const r = bossPhysics(b, dt);
        if (r.landed) { landFx(b, b.landKind); b.state = 'idle'; b.t = 1.2 / sp; }
        break;
      }
      case 'windup': {
        b.vx = 0;
        bossPhysics(b, dt);
        if (b.t <= 0) startAction(b, sp);
        break;
      }
      case 'charge': {
        b.vx = b.dir * 190 * sp;
        const r = bossPhysics(b, dt);
        if (Math.random() < 0.4) emit(b.x + b.w / 2, b.y + b.h, 1, '#ffffff', 40, 0, 0.3);
        if (r.wall || b.t < -3) {
          b.state = 'dizzy'; b.t = 2.6 / Math.min(sp, 1.3); b.vx = 0;
          if (!reduceMotion) shake = 0.25;
          sfx.thud();
          bubble(b, 'Ohi ohi...', 1);
        }
        break;
      }
      case 'dizzy': {
        b.vx = 0;
        bossPhysics(b, dt);
        if (b.t <= 0) { b.state = 'idle'; b.t = 0.4; }
        break;
      }
      case 'fly': {
        const ax0 = lv.arena.x0 * T + 10, ax1 = lv.arena.x1 * T - b.w - 10;
        b.y += (46 - b.y) * Math.min(1, dt * 3);
        b.x += b.dir * 95 * sp * dt;
        if (b.x < ax0) { b.x = ax0; b.dir = 1; }
        if (b.x > ax1) { b.x = ax1; b.dir = -1; }
        b.bombT -= dt;
        if (b.bombT <= 0) {
          b.bombT = 1.25 / sp;
          lv.projs.push({ kind: 'bomba', x: b.x + b.w / 2, y: b.y + b.h, vx: (pcx - b.x - b.w / 2) * 0.6, vy: -60, grav: PGRAV, life: 4, t: 0, r: 5 });
          sfx.throw();
        }
        if (b.t <= 0) { b.state = 'air'; b.vx = 0; b.vy = 0; b.onGround = false; b.landKind = 'big'; bubble(b, 'Uff, che fatica!', 1); }
        break;
      }
    }
  }

  function nextAttack(b, sp) {
    const a = b.def.attacks[b.ai++ % b.def.attacks.length];
    b.dir = P.x + P.w / 2 > b.x + b.w / 2 ? 1 : -1;
    if (a === 'hop') { b.vx = b.dir * 90 * sp; b.vy = -380; b.state = 'air'; b.landKind = 'small'; }
    else if (a === 'bigjump') { b.vx = b.dir * 120 * sp; b.vy = -580; b.state = 'air'; b.landKind = 'big'; }
    else if (a === 'fly') { b.state = 'fly'; b.t = 3.4; b.vy = 0; b.bombT = 1.0; bubble(b, 'Ih ih ih!', 1); }
    else { b.state = 'windup'; b.next = a; b.t = (a === 'charge' ? 1.0 : 0.65) / Math.min(sp, 1.2); }
  }

  function startAction(b, sp) {
    const pcx = P.x + P.w / 2, phase2 = b.hp <= b.maxHp / 2;
    const bx = b.x + b.w / 2, by = b.y + 6;
    if (b.next === 'charge') { b.state = 'charge'; b.t = 0; return; }
    if (b.next === 'throw') {
      const n = phase2 ? 2 : 1;
      for (let i = 0; i < n; i++) throwAt(bx, by, pcx + (i - (n - 1) / 2) * 60, P.y + P.h, 'neve', 1.0);
    } else if (b.next === 'spit') {
      const n = phase2 ? 2 : 1;
      for (let i = 0; i < n; i++) throwAt(bx, by, pcx + (i - (n - 1) / 2) * 50, P.y + P.h, 'slime', 0.95 + i * 0.1);
    } else if (b.next === 'bubbles') {
      const n = phase2 ? 3 : 2;
      for (let i = 0; i < n; i++) lv.projs.push({ kind: 'bolla', x: bx, y: b.y + b.h / 2, by: P.y + 4 - i * 14, vx: b.dir * (50 + i * 14) * sp, vy: 0, grav: 0, life: 5 + i * 0.9, t: -i * 0.9, r: 6 });
      sfx.throw();
    } else if (b.next === 'summon') {
      const alive = lv.enemies.filter(e => e.alive && e.mini).length;
      for (let i = 0; i < 1 && alive + i < 2; i++) {
        const e = mkEnemy(b.def.summon, Math.floor(bx / T) + (i ? 1 : -1), Math.floor((b.y + b.h - 1) / T));
        e.mini = true; e.vy = -250; e.dir = i ? 1 : -1;
        lv.enemies.push(e);
      }
      bubble(b, 'Aiuto, zucchette!', 1.2);
    }
    b.state = 'idle'; b.t = 1.4 / sp;
  }

  function landFx(b, kind) {
    if (kind !== 'big') { sfx.thud(); emit(b.x + b.w / 2, b.y + b.h, 6, '#d8d0e8', 60, 200, 0.3); return; }
    if (!reduceMotion) shake = 0.3;
    sfx.boom();
    emit(b.x + b.w / 2, b.y + b.h, 14, '#d8d0e8', 90, 200, 0.4);
    const gy = b.y + b.h, sp = bossSpeed(b);
    for (const d of [-1, 1]) lv.projs.push({ kind: 'onda', x: b.x + b.w / 2 + d * b.w / 2, y: gy - 6, gy, vx: d * 125 * sp, vy: 0, grav: 0, life: 4, t: 0, r: 6 });
    if (b.def.icicles && lv.arena) {
      const n = b.hp <= b.maxHp / 2 ? 3 : 2;
      for (let i = 0; i < n; i++) {
        const x = (lv.arena.x0 + 1 + Math.random() * 22) * T;
        lv.projs.push({ kind: 'ghiacciolo', x, y: 2, gy: 14 * T, vx: 0, vy: 0, grav: 0, life: 4, t: -i * 0.15, r: 4 });
      }
    }
  }

  function bossTouch(b) {
    const guarded = b.def.guard.includes(b.state);
    const top = P.vy > 0 && P.y + P.h - b.y < 14;
    if (top && !guarded) {
      P.vy = -470; P.canDouble = true;
      if (b.inv <= 0) {
        b.hp--; b.inv = 1.0;
        sfx.bossHit();
        hitstop = 0.06;
        emit(b.x + b.w / 2, b.y, 12, '#ffd23f', 80, 150, 0.5);
        if (b.state === 'dizzy') { b.state = 'idle'; b.t = 0.35; }
        if (b.hp <= 0) return defeatBoss(b);
        bubble(b, pick(b.def.lines.hit), 1.2);
        if (b.def.onHit) {
          const e = mkEnemy(b.def.onHit, Math.floor((b.x + b.w / 2) / T), Math.floor((b.y + b.h - 1) / T));
          e.mini = true; e.vy = -300; lv.enemies.push(e);
        }
      }
    } else if (top && guarded && !b.def.spiky) {
      P.vy = -STOMP; P.canDouble = true;
      bubble(b, 'Non adesso!', 0.8);
    } else {
      hurt(b.def.name, b);
    }
  }

  function defeatBoss(b) {
    b.defeated = true; b.vy = -200;
    bubble(b, b.def.lines.defeat, 3);
    for (let y = 0; y < ROWS; y++) for (let x = 0; x < lv.w; x++) if (lv.grid[y][x] === 'G') lv.grid[y][x] = ' ';
    lv.tiles = renderTiles(lv);
    lv.projs = [];
    const w = lv.world, name = heroOr().name;
    lv.queue.push({ key: `${save.mode}:outro${w}`, text: loreText(LORE[save.mode].outro[w], name) });
    const ab = w === 0 ? 'dash' : w === 1 ? 'wall' : null;
    if (ab && unlockAbility(ab)) lv.queue.push({ key: null, text: ABILITY_TEXT[ab] });
    for (let i = 0; i < 25; i++) lv.loose.push({ x: b.x + b.w / 2, y: b.y + 4, vx: (Math.random() - 0.5) * 260, vy: -200 - Math.random() * 250, life: 12, got: false, col: i % 4 });
    sfx.win();
  }

  // ---------- giocatore ----------
  function doJump(power, isDouble) {
    P.vy = -power; P.jumpBuf = 0; P.coyote = 0; P.onGround = false; P.ride = null;
    P.sx = 0.75; P.sy = 1.3;
    if (isDouble) { sfx.djump(); emit(P.x + P.w / 2, P.y + P.h, 8, '#ffffff', 50, 0, 0.35); }
    else { sfx.jump(); emit(P.x + P.w / 2, P.y + P.h, 4, '#d8d0e8', 30, 120, 0.3); }
  }

  function setHeight(h) { P.y += P.h - h; P.h = h; }
  // da che parte c'e' un muro attaccato al giocatore (1 destra, -1 sinistra, 0 niente)
  function wallSide() {
    const t0 = Math.floor((P.y + 3) / T), t1 = Math.floor((P.y + P.h - 3) / T);
    const r = Math.floor((P.x + P.w + 1.5) / T), l = Math.floor((P.x - 1.5) / T);
    for (let ty = t0; ty <= t1; ty++) {
      if (isSolid(tile(r, ty)) && r < lv.w) return 1;
      if (isSolid(tile(l, ty)) && l >= 0) return -1;
    }
    return 0;
  }
  // atterraggio dello schianto: rompe le casse, schiaccia i nemici vicini
  function poundImpact() {
    const ty = Math.floor((P.y + P.h + 1) / T);
    let broke = false;
    for (let tx = Math.floor(P.x / T) - 1; tx <= Math.floor((P.x + P.w - 0.01) / T) + 1; tx++) {
      if (tile(tx, ty) === 'X') {
        lv.grid[ty][tx] = ' '; broke = true;
        emit(tx * T + 8, ty * T + 8, 12, '#c8894a', 90, 300, 0.7);
      }
    }
    if (broke) { lv.tiles = renderTiles(lv); sfx.crack(); P.onGround = false; P.vy = POUND_V; return; }
    P.pound = 0;
    if (!reduceMotion) shake = 0.22;
    sfx.thud();
    emit(P.x + P.w / 2, P.y + P.h, 14, '#d8d0e8', 90, 200, 0.4);
    for (const e of lv.enemies) {
      if (!e.alive || !canStomp(e)) continue;
      if (Math.abs(e.x + e.w / 2 - (P.x + P.w / 2)) < 52 && Math.abs(e.y + e.h - (P.y + P.h)) < 20) {
        e.alive = false; e.timer = e.k.reassemble ? 3 : 0.6;
        bubble(e, 'Bum!', 1);
      }
    }
  }
  function canStand() { return boxFree({ x: P.x, y: P.y + P.h - STAND_H, w: P.w, h: STAND_H }); }
  function onOneWay() {
    if (P.ride) return true;
    const ty = Math.floor((P.y + P.h + 1) / T), l = Math.floor(P.x / T), r = Math.floor((P.x + P.w - 0.01) / T);
    for (let tx = l; tx <= r; tx++) if (isSolid(tile(tx, ty))) return false;
    for (let tx = l; tx <= r; tx++) { const c = tile(tx, ty); if (c === '=' || c === '-') return true; }
    return false;
  }

  function updatePlayer(dt) {
    if (P.ride) { P.x += P.ride.dx; P.y += P.ride.dy; }
    P.sx += (1 - P.sx) * Math.min(1, dt * 12);
    P.sy += (1 - P.sy) * Math.min(1, dt * 12);
    if (jumpLock) { if (keys.jump) jumpPressed = false; else jumpLock = false; }
    if (P.drop > 0) P.drop -= dt;

    // scendere dalle assi: Giu' + salto
    if (jumpPressed && keys.down && P.onGround && onOneWay()) { P.drop = 0.25; jumpPressed = false; P.onGround = false; P.ride = null; }

    // abbassarsi e scivolata
    if (downPressed && P.onGround && P.slide <= 0 && Math.abs(P.vx) > 90) {
      P.slide = 0.55; P.vx = Math.sign(P.vx) * SLIDE_V;
      if (P.h !== CROUCH_H) setHeight(CROUCH_H);
      sfx.slide();
    }
    if (P.slide > 0) {
      P.slide -= dt;
      if (Math.random() < 0.5) emit(P.x + P.w / 2, P.y + P.h, 1, '#d8d0e8', 20, 0, 0.3);
      if (!P.onGround) P.slide = 0;
    }
    if (P.slide <= 0 && P.onGround && keys.down && P.h !== CROUCH_H) setHeight(CROUCH_H);
    if (P.h === CROUCH_H && P.slide <= 0 && !(keys.down && P.onGround) && canStand()) setHeight(STAND_H);
    const crouched = P.h === CROUCH_H;

    const dir = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
    const ice = lv.theme.ice && P.onGround;
    if (P.knock > 0) P.knock -= dt;
    else if (P.slide > 0) P.vx -= Math.sign(P.vx) * 220 * dt;
    else {
      if (dir) P.face = dir;
      const target = dir * (crouched && P.onGround ? RUN * 0.35 : RUN);
      const a = P.onGround ? (dir ? (ice ? 650 : 1500) : (ice ? 320 : 1900)) : 1100;
      if (P.vx < target) P.vx = Math.min(target, P.vx + a * dt);
      else if (P.vx > target) P.vx = Math.max(target, P.vx - a * dt);
    }

    // scatto
    if (P.dashCool > 0) P.dashCool -= dt;
    if (P.onGround) P.dashUsed = false;
    if (dashPressed && save.abilities.dash && P.dashCool <= 0 && !P.dashUsed && P.slide <= 0 && P.pound === 0) {
      if (P.h !== STAND_H && canStand()) setHeight(STAND_H);
      P.dash = 0.2; P.dashCool = 0.55;
      if (!P.onGround) P.dashUsed = true;
      sfx.dash();
      emit(P.x + P.w / 2, P.y + P.h / 2, 8, '#ffffff', 40, 0, 0.3);
    }
    // schianto
    if (downPressed && !P.onGround && save.abilities.pound && P.pound === 0 && P.dash <= 0) {
      P.pound = 0.12; P.sx = 1.25; P.sy = 0.8;
      sfx.pound();
    }

    // salto: altezza fissa, doppio salto in aria, e se tieni premuto continui a saltare
    if (jumpPressed) P.jumpBuf = 0.14; else P.jumpBuf -= dt;
    P.coyote = P.onGround ? D.coyote : P.coyote - dt;
    if (P.onGround) P.canDouble = true;
    const wantsJump = P.jumpBuf > 0 || (keys.jump && !jumpLock && P.onGround && !keys.down);
    if (P.coyote > 0 && wantsJump && (P.h === STAND_H || canStand())) {
      if (P.h !== STAND_H) setHeight(STAND_H);
      P.slide = 0;
      doJump(JUMP, false);
    } else if (jumpPressed && !P.onGround && save.abilities.wall && wallSide() && P.pound === 0) {
      const sd = wallSide();
      P.vy = -JUMP * 0.95; P.vx = -sd * 170; P.face = -sd; P.knock = 0.16; P.canDouble = true; P.dashUsed = false;
      P.sx = 0.75; P.sy = 1.3;
      sfx.jump();
      emit(sd > 0 ? P.x + P.w : P.x, P.y + P.h / 2, 6, '#ffffff', 40, 60, 0.3);
    } else if (jumpPressed && !P.onGround && P.canDouble && P.pound === 0) { P.canDouble = false; doJump(DJUMP, true); }

    if (P.dash > 0) {
      P.dash -= dt; P.vy = 0; P.vx = P.face * DASH_V;
      if (Math.random() < 0.7) emit(P.x + P.w / 2, P.y + P.h / 2, 1, '#ffffff', 10, 0, 0.25);
      if (P.dash <= 0) P.vx = P.face * RUN;
    } else if (P.pound > 0) {
      P.pound -= dt; P.vx = 0; P.vy = 0;
      if (P.pound <= 0) { P.pound = -1; P.vy = POUND_V; }
    } else if (P.pound < 0) {
      P.vx = 0; P.vy = POUND_V;
    } else P.vy = Math.min(MAXFALL, P.vy + GRAV * (P.vy > 0 ? 1.1 : 1) * dt);
    if (save.abilities.wall && !P.onGround && P.vy > WALL_SLIDE && dir !== 0 && wallSide() === dir && P.pound === 0) {
      P.vy = WALL_SLIDE;
      if (Math.random() < 0.3) emit(dir > 0 ? P.x + P.w : P.x, P.y + 3, 1, '#ffffff', 10, 40, 0.3);
    }

    const prevX = P.x;
    P.x += P.vx * dt;
    collideX(P);
    for (const q of extRects(P)) {
      if (prevX + P.w <= q.x + 0.5) P.x = q.x - P.w;
      else if (prevX >= q.x + T - 0.5) P.x = q.x + T;
      else continue;
      P.vx = 0; P.slide = 0;
    }
    const wasGround = P.onGround;
    const prevBottom = P.y + P.h;
    P.y += P.vy * dt;
    collideY(P, prevBottom, P.drop > 0, true);
    for (const q of extRects(P)) { P.y = q.y + 8; if (P.vy < 0) P.vy = 0; }
    P.ride = null;
    if (P.vy >= 0 && P.drop <= 0) {
      for (const p of lv.plats) {
        if (P.x + P.w > p.x && P.x < p.x + p.w && prevBottom <= p.y + 2 && P.y + P.h >= p.y) {
          P.y = p.y - P.h; P.vy = 0; P.onGround = true; P.ride = p;
          break;
        }
      }
    }
    // molle: basta passarci sopra
    let spring = null;
    if (P.vy >= 0) {
      const fy = Math.floor((P.y + P.h - 1) / T);
      for (let tx = Math.floor(P.x / T); tx <= Math.floor((P.x + P.w - 0.01) / T); tx++) {
        if (tile(tx, fy) === 'S' && P.y + P.h >= fy * T + 9) { spring = { tx, ty: fy }; break; }
      }
    }
    if (P.pound < 0 && P.onGround && !spring) poundImpact();
    if (spring) {
      lv.springs.set(spring.ty * lv.w + spring.tx, 1);
      if (P.h !== STAND_H) setHeight(STAND_H);
      P.slide = 0;
      P.vy = -SPRING * (P.pound < 0 ? 1.2 : 1); P.pound = 0; P.onGround = false; P.coyote = 0; P.canDouble = true;
      P.sx = 0.7; P.sy = 1.35;
      sfx.boing();
      bubble({ x: spring.tx * T, y: spring.ty * T - 14, w: 16, h: 16 }, 'Boing!', 0.7);
    } else if (P.onGround && !wasGround) {
      P.sx = 1.25; P.sy = 0.78;
      emit(P.x + P.w / 2, P.y + P.h, 3, '#d8d0e8', 25, 100, 0.25);
    }
    P.anim += Math.abs(P.vx) * dt;
    downPressed = false; dashPressed = false;

    // cadute e acqua
    if (P.y > VH + 20) return die('Sei caduto nel vuoto!');
    const l = Math.floor(P.x / T), r = Math.floor((P.x + P.w - 0.01) / T);
    const tp = Math.floor(P.y / T), bt = Math.floor((P.y + P.h - 0.01) / T);
    for (let ty = tp; ty <= bt; ty++) for (let tx = l; tx <= r; tx++) {
      const c = tile(tx, ty);
      if (c === '~' && overlap(P, tx * T, ty * T + 5, T, 11)) return die(lv.theme.liquidMsg + '!');
      if (c === '^' && overlap(P, tx * T + 2, ty * T + 7, 12, 9)) { hurt('Spine', { x: P.x + P.w / 2 - P.face * 8, w: 0 }); if (state !== 'play') return; }
    }

    // monete e cuori
    const cx = P.x + P.w / 2, cy = P.y + P.h / 2;
    for (const c of lv.coins) {
      if (c.got) continue;
      const dy = c.y + Math.sin(t * 3 + c.ph) * 1.5 - cy, dx = c.x - cx;
      if (dx * dx + dy * dy < 14 * 14) {
        c.got = true; lv.got++; addCoins(1);
        sfx.coin();
        emit(c.x, c.y, 6, '#ffe27a', 50, 0, 0.4);
      }
    }
    for (const c of lv.loose) {
      if (!c.got && c.life < 11.6 && Math.abs(c.x - cx) < 12 && Math.abs(c.y - cy) < 14) { c.got = true; addCoins(1); sfx.coin(); }
    }
    for (const h of lv.hearts) {
      if (h.got) continue;
      if (Math.abs(h.x - cx) < 12 && Math.abs(h.y - cy) < 14) {
        h.got = true;
        if (P.hearts < D.hearts) { P.hearts++; bubble(P, 'Gnam!'); } else bubble(P, 'Pancia piena!');
        sfx.heart();
        emit(h.x, h.y, 10, '#ff5a7a', 60, 0, 0.5);
      }
    }

    // bandierine
    for (const c of lv.checks) {
      if (!c.lit && overlap(P, c.tx * T, c.ty * T - 16, 16, 32)) {
        c.lit = true;
        lv.respawn = { x: c.tx * T + 3, y: c.ty * T + T - STAND_H };
        sfx.check();
        bubble({ x: c.tx * T, y: c.ty * T - 10, w: 16, h: 16 }, 'Salvato!', 1.1);
      }
    }

    // nemici
    for (const e of lv.enemies) {
      if (!e.alive || !overlap(P, e.x, e.y, e.w, e.h)) continue;
      const slideHit = canStomp(e) && ((P.slide > 0 && e.k.beh !== 'swooper' && e.k.beh !== 'flyer') || P.dash > 0 || P.pound < 0);
      if (slideHit) {
        e.alive = false; e.timer = e.k.reassemble ? 3 : 0.6;
        sfx.stomp();
        bubble(e, P.pound < 0 ? 'Bum!' : 'Travolto!', 1);
        emit(e.x + e.w / 2, e.y + 4, 8, '#ffffff', 60, 150, 0.4);
      } else if (P.vy > 0 && P.y + P.h - e.y < 10 && canStomp(e)) {
        e.alive = false;
        e.timer = e.k.reassemble ? 3 : 0.6;
        P.vy = -(keys.jump ? JUMP : STOMP); P.canDouble = true;
        P.sx = 1.2; P.sy = 0.8;
        sfx.stomp();
        hitstop = 0.04;
        bubble(e, pick(['Ahia!', 'Uffa!', 'Splat!', 'Ohi!']), 1);
        emit(e.x + e.w / 2, e.y + 4, 8, '#ffffff', 60, 150, 0.4);
      } else if (canHurt(e)) {
        hurt(e.k.name, e);
        if (state !== 'play') return;
      }
    }

    const b = lv.boss;
    if (b && !b.defeated && b.state !== 'sleep' && overlap(P, b.x + 3, b.y + 3, b.w - 6, b.h - 3)) {
      bossTouch(b);
      if (state !== 'play') return;

    const d = lv.door;
    if (d && overlap(P, d.tx * T - 2, d.ty * T - 16, 20, 32)) { state = 'clear'; timer = 1.1; sfx.win(); }

  function hurt(cause, src) {
    if (P.inv > 0 || state !== 'play') return;
    if (P.hearts <= 1) return die(`Ti ha preso: ${cause}`);
    P.hearts--; lv.hits++;
    heartFx.push({ idx: P.hearts, t: 0 });
    sfx.hurt();
    bubble(P, pick(['Ahi!', 'Ops!', 'Mamma mia!']));
    P.inv = 1.4; P.knock = 0.25; P.ride = null;
    P.vy = -280;

  function updateDeath(dt) {
    const d = death;
    d.t -= dt;
    if (d.phase === 'freeze') {
      if (d.t <= 0) { d.phase = 'fly'; d.t = 1.3; P.vy = -420; P.vx = P.face * -30; }
    } else if (d.phase === 'fly') {
      P.vy += GRAV * dt; P.y += P.vy * dt; P.x += P.vx * dt; P.rot += dt * 12;
      if (d.t <= 0) { d.phase = 'card'; d.t = 1.3; }
    } else if (d.phase === 'card') {
      if (d.t <= 0) { d.phase = 'iris'; d.t = 0.45; }
    } else if (d.phase === 'iris') {
      if (d.t <= 0) finishDeath();
    }
  }

  function finishDeath() {
    const d = death;
    death = null;
    if (d.out) P.hearts = D.hearts;
