  // ================= disegno =================
  // Il mondo si disegna ad alta risoluzione (S pixel veri per ogni pixel di gioco).
  // I personaggi restano in pixel art: si disegnano su un livello a parte e ricevono un contorno.
  let S = 3;
  function fitCanvas() {
    const css = cv.clientWidth || 960;
    const want = Math.max(1, Math.min(3, Math.ceil(css * (window.devicePixelRatio || 1) / VW - 0.15)));
    if (want === S) return;
    S = want;
    cv.width = VW * S; cv.height = VH * S;
    if (lv) lv.tiles = new Map();
  }
  addEventListener('resize', fitCanvas);
  const ent = document.createElement('canvas'); ent.width = VW; ent.height = VH;
  const entCtx = ent.getContext('2d'); entCtx.imageSmoothingEnabled = false;
  const outl = document.createElement('canvas'); outl.width = VW; outl.height = VH;
  const outlCtx = outl.getContext('2d'); outlCtx.imageSmoothingEnabled = false;
  const TAU = Math.PI * 2;
  const px = (x, y, w, h, col) => { ctx.fillStyle = col; ctx.fillRect(Math.round(x), Math.round(y), w, h); };
  const COIN_H = ['#ff6fb5', '#5fe0d0', '#ffd23f', '#b58cff'];

  const shadeCache = new Map();
  function shadeHex(hex, amt) {
    const k = hex + '|' + amt;
    let v = shadeCache.get(k);
    if (v) return v;
    if (typeof hex !== 'string' || hex[0] !== '#' || hex.length !== 7) { shadeCache.set(k, hex); return hex; }
    let r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
    if (amt > 0) { r += (255 - r) * amt; g += (255 - g) * amt; b += (255 - b) * amt; }
    else { r *= 1 + amt; g *= 1 + amt; b *= 1 + amt; }
    v = `rgb(${r | 0},${g | 0},${b | 0})`;
    shadeCache.set(k, v);
    return v;
  }

  // Mappa di pixel; con shade i pixel in alto si schiariscono e quelli in basso si scuriscono.
  function drawMap(c, map, pal, x, y, flip, scale = 1, w = 0, shade = false) {
    if (!w) for (const r of map) w = Math.max(w, r.length);
    const X = Math.round(x), Y = Math.round(y);
    for (let r = 0; r < map.length; r++) {
      const row = map[r];
      for (let i = 0; i < row.length; i++) {
        let col = pal[row[i]];
        if (!col) continue;
        if (shade) {
          const up = r > 0 ? pal[map[r - 1][i]] : null;
          const dn = r < map.length - 1 ? pal[map[r + 1][i]] : null;
          if (!up) col = shadeHex(col, 0.3);
          else if (!dn) col = shadeHex(col, -0.28);
        }
        c.fillStyle = col;
        c.fillRect(X + (flip ? w - 1 - i : i) * scale, Y + r * scale, scale, scale);
      }
    }
  }

  function heroColor(c) { return typeof c === 'string' && c[0] === '#' ? c : (COLORS.find(x => x.id === c) || COLORS[4]).c; }
  function heroPal(h) {
    const body = BODIES[h.body] || BODIES.bimbo;
    const pal = { ...body.pal, m: heroColor(h.color) };
    if (h.color2 && SECOND[h.body]) pal[SECOND[h.body]] = h.color2;
    return pal;
  }
  // Disegna l'eroe a partire dall'angolo in alto a sinistra (x, y), alto 15 pixel.
  function drawHero(c, h, x, y, scale, flip, xEyes, shade = true) {
    const bodyKey = BODIES[h.body] ? h.body : 'bimbo';
    const body = BODIES[bodyKey], an = ANCH[bodyKey];
    const pal = heroPal(h);
    if (xEyes) pal.k = '#ffffff';
    const acc = ACCS[h.acc] ? h.acc : 'nessuno';
    const ac = h.accColor || ACCS[acc].color;
    const pp = (lx, ly, w, hh, col) => { c.fillStyle = col; c.fillRect(x + (flip ? 12 - lx - w : lx) * scale, y + ly * scale, w * scale, hh * scale); };
    // dietro al corpo
    if (acc === 'mantello') { pp(0, an.neck, 3, 7, ac); pp(1, an.neck + 7, 3, 1, shadeHex(ac, -0.3)); pp(0, an.neck, 1, 7, shadeHex(ac, -0.25)); }
    if (acc === 'zainetto') { pp(0, an.neck, 3, 5, ac); pp(0, an.neck + 1, 3, 1, shadeHex(ac, -0.3)); }
    drawMap(c, body.map, pal, x, y, flip, scale, 12, shade);
    // davanti al corpo
    if (acc === 'occhiali') {
      for (const [ex, ey] of an.eyes) { pp(ex - 1, ey, 3, 1, ac); pp(ex - 1, ey, 1, 1, '#8ab0ff'); }
      if (an.eyes.length > 1) { const [a0, a1] = an.eyes; pp(a0[0] + 2, a0[1], Math.max(0, a1[0] - a0[0] - 3), 1, ac); }
    } else if (acc === 'baffi') {
      const [mx, my] = an.mouth; pp(mx - 1, my, 4, 1, ac); pp(mx - 2, my + 1, 1, 1, ac); pp(mx + 3, my + 1, 1, 1, ac);
    } else if (acc === 'sciarpa') {
      pp(2, an.neck, 8, 2, ac); pp(2, an.neck, 8, 1, shadeHex(ac, 0.25)); pp(7, an.neck + 2, 2, 3, shadeHex(ac, -0.15));
    } else if (acc === 'papillon') {
      pp(3, an.neck, 2, 2, ac); pp(6, an.neck, 2, 2, ac); pp(5, an.neck, 1, 1, shadeHex(ac, -0.35));
    }
    const hat = HATS[h.hat];
    if (hat && hat.map.length) {
      const hw = Math.max(...hat.map.map(r => r.length));
      const [hx, hy] = body.hat;
      const ox = flip ? 12 - hx - hw : hx;
      const hpal = h.hatColor ? { ...hat.pal, c: h.hatColor } : hat.pal;
      drawMap(c, hat.map, hpal, x + ox * scale, y + (hy - hat.map.length + 1) * scale, flip, scale, hw, shade);
    }
  }

  function drawPix(rows, x, y, col) {
    ctx.fillStyle = col;
    for (let r = 0; r < rows.length; r++) for (let i = 0; i < rows[r].length; i++) if (rows[r][i] === '#') ctx.fillRect(Math.round(x) + i, Math.round(y) + r, 1, 1);
  }

  // ---------- piccoli attrezzi di disegno ----------
  function rr(x, y, w, h, r, g = ctx) {
    g.beginPath();
    g.moveTo(x + r, y);
    g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
    g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r);
    g.closePath();
  }
  function lin(g, x0, y0, x1, y1, stops) { const gr = g.createLinearGradient(x0, y0, x1, y1); stops.forEach(([o, c]) => gr.addColorStop(o, c)); return gr; }
  function rad(g, x, y, r0, r1, stops) { const gr = g.createRadialGradient(x, y, r0, x, y, r1); stops.forEach(([o, c]) => gr.addColorStop(o, c)); return gr; }
  function glow(x, y, r, col) { ctx.fillStyle = rad(ctx, x, y, 0, r, [[0, col], [1, 'rgba(0,0,0,0)']]); ctx.fillRect(x - r, y - r, r * 2, r * 2); }
  function star(g, x, y, r1, r2, n = 5, rot = -Math.PI / 2) {
    g.beginPath();
    for (let i = 0; i < n * 2; i++) { const r = i % 2 ? r2 : r1, a = rot + i * Math.PI / n; g.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r); }
    g.closePath();
  }
  function sparkle(x, y, s, a = 1) {
    ctx.fillStyle = `rgba(255,255,255,${a})`;
    star(ctx, x, y, s, s * 0.25, 4, 0); ctx.fill();
  }
  function label(str, x, y, size, col, align = 'left', font = 'Fredoka', weight = 600) {
    ctx.font = `${font === 'Lilita One' ? '' : weight + ' '}${size}px "${font}", "Trebuchet MS", sans-serif`;
    ctx.textAlign = align; ctx.textBaseline = 'middle';
    ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fillText(str, x + 0.4, y + 0.6);
    ctx.fillStyle = col; ctx.fillText(str, x, y);
  }

  // ---------- caselle (disegnate una volta, a pezzi, ad alta risoluzione) ----------
  const HD = {
    prati:    { soil: ['#c0834c', '#8a5530'], pebble: '#dca06a', pebbleDk: '#6e4426', cap: ['#a4ee72', '#4fae3f'], blade: '#7ed357' },
    spiaggia: { soil: ['#f6dc9e', '#dcb06a'], pebble: '#fff3d0', pebbleDk: '#c49a55', cap: ['#fff6da', '#f2d89c'], blade: null },
    montagne: { soil: ['#9db3dc', '#5e74a6'], pebble: '#c3d4f3', pebbleDk: '#4c5f8e', cap: ['#ffffff', '#d6e5fb'], blade: null },
    orto:     { soil: ['#83532f', '#4f2e19'], pebble: '#9d6a43', pebbleDk: '#3a2111', cap: ['#86c452', '#3f7a2c'], blade: '#5f9a3a' },
    cantine:  { soil: ['#6f7598', '#454a67'], pebble: '#8a90b2', pebbleDk: '#353a55', cap: ['#79a868', '#3f6a3b'], blade: null },
    soffitta: { soil: ['#a36d48', '#6a4128'], pebble: '#b47d55', pebbleDk: '#4f2e1a', cap: ['#c99a6a', '#94623e'], blade: null }
  };
  const CH_W = 32;
  function renderTiles() { return new Map(); }
  function tileChunk(i) {
    let cnv = lv.tiles.get(i);
    if (cnv) return cnv;
    const x0 = i * CH_W, cw = Math.min(CH_W, lv.w - x0);
    cnv = document.createElement('canvas');
    cnv.width = cw * T * S; cnv.height = VH * S;
    const g = cnv.getContext('2d');
    g.setTransform(S, 0, 0, S, -x0 * T * S, 0);
    for (let y = 0; y < ROWS; y++) for (let x = Math.max(0, x0 - 1); x <= Math.min(lv.w - 1, x0 + cw); x++) drawTile(g, lv, x, y);
    if (lv.tiles.size >= 6) lv.tiles.delete(lv.tiles.keys().next().value);
    lv.tiles.set(i, cnv);
    return cnv;
  }
  function drawTileChunks(c) {
    const i0 = Math.max(0, Math.floor(c / (CH_W * T))), i1 = Math.floor((c + VW) / (CH_W * T));
    for (let i = i0; i <= i1 && i * CH_W < lv.w; i++) {
      const cnv = tileChunk(i);
      ctx.drawImage(cnv, i * CH_W * T, 0, cnv.width / S, VH);
    }
  }

  function drawTile(g, L, x, y) {
    const ch = L.grid[y][x];
    if (ch === ' ' || ch === '~' || ch === '-' || ch === 'S') return;
    const key = L.themeKey, hd = HD[key], th = L.theme, X = x * T, Y = y * T;
    const at = (dx, dy) => { const xx = x + dx, yy = y + dy; if (yy < 0 || yy >= ROWS) return ' '; if (xx < 0 || xx >= L.w) return '#'; return L.grid[yy][xx]; };
    const sol = c => c === '#' || c === 'u' || c === 'G';
    if (ch === '#' || ch === 'u') {
      g.fillStyle = lin(g, 0, Y, 0, Y + T, [[0, hd.soil[0]], [1, hd.soil[1]]]);
      g.fillRect(X, Y, T + 0.3, T + 0.3);
      soilTexture(g, key, hd, x, y, X, Y);
      if (!sol(at(-1, 0))) { g.fillStyle = lin(g, X, 0, X + 4, 0, [[0, 'rgba(0,0,0,0.3)'], [1, 'rgba(0,0,0,0)']]); g.fillRect(X, Y, 4, T); }
      if (!sol(at(1, 0))) { g.fillStyle = lin(g, X + T, 0, X + T - 4, 0, [[0, 'rgba(0,0,0,0.3)'], [1, 'rgba(0,0,0,0)']]); g.fillRect(X + T - 4, Y, 4, T); }
      if (ch === 'u') underside(g, key, hd, x, y, X, Y);
      else if (!sol(at(0, 1)) && y < ROWS - 1) { g.fillStyle = lin(g, 0, Y + T, 0, Y + T - 3, [[0, 'rgba(0,0,0,0.35)'], [1, 'rgba(0,0,0,0)']]); g.fillRect(X, Y + T - 3, T, 3); }
      if (!sol(at(0, -1))) topCap(g, key, hd, x, y, X, Y, !sol(at(-1, 0)), !sol(at(1, 0)));
      return;
    }
    if (ch === 'X') { crate(g, X, Y); return; }
    if (ch === '=') plank(g, th.plank, X, Y, x);
    else if (ch === '^') spikes(g, key, th, X, Y, x);
    else if (ch === 'G') gate(g, X, Y);
  }

  function soilTexture(g, key, hd, x, y, X, Y) {
    if (key === 'cantine') {
      for (let r = 0; r < 2; r++) {
        const by = Y + r * 8, j = X + ((x + y + r) % 2 ? 5 : 11);
        g.fillStyle = 'rgba(255,255,255,0.12)'; g.fillRect(X, by + 0.3, T, 0.7);
        g.fillStyle = 'rgba(15,12,30,0.55)'; g.fillRect(X, by + 7.2, T, 0.8); g.fillRect(j, by, 0.8, 8);
        g.fillStyle = 'rgba(255,255,255,0.08)'; g.fillRect(j + 0.8, by + 0.6, 0.6, 6.4);
        if (hash(x, y, r) % 3 === 0) { g.fillStyle = 'rgba(0,0,0,0.12)'; g.fillRect(X + 1 + hash(x, y, r + 4) % 8, by + 2, 3, 3); }
      }
      return;
    }
    if (key === 'soffitta') {
      for (let r = 0; r < 3; r++) {
        const by = Y + r * 5.33;
        g.fillStyle = 'rgba(60,30,15,0.55)'; g.fillRect(X, by + 4.8, T, 0.6);
        g.fillStyle = 'rgba(255,220,180,0.14)'; g.fillRect(X, by + 0.2, T, 0.5);
        g.strokeStyle = 'rgba(70,35,15,0.3)'; g.lineWidth = 0.4;
        const gy = by + 2.4 + (hash(x, y, r) % 3) * 0.4;
        g.beginPath(); g.moveTo(X, gy); g.bezierCurveTo(X + 5, gy - 1, X + 10, gy + 1, X + 16, gy); g.stroke();
        if ((x + r) % 4 === 0) { g.fillStyle = '#3a2416'; g.fillRect(X + 1.2, by + 2.2, 0.9, 0.9); }
      }
      return;
    }
    if (key === 'montagne') {
      g.strokeStyle = 'rgba(40,55,100,0.35)'; g.lineWidth = 0.6;
      for (let k = 0; k < 2; k++) {
        const sy = Y + 5 + k * 6 + (hash(x, y, k) % 3);
        g.beginPath(); g.moveTo(X, sy); g.bezierCurveTo(X + 5, sy - 1.5, X + 11, sy + 1.5, X + 16, sy); g.stroke();
      }
      if (hash(x, y) % 3 === 0) { g.fillStyle = 'rgba(255,255,255,0.55)'; g.beginPath(); g.moveTo(X + 5, Y + 9); g.lineTo(X + 8, Y + 7); g.lineTo(X + 9, Y + 8); g.lineTo(X + 6, Y + 10); g.fill(); }
      return;
    }
    const n = key === 'spiaggia' ? 2 : 3;
    for (let k = 0; k < n; k++) {
      const hk = hash(x, y, k);
      const cx = X + 2 + (hk % 12), cy = Y + 4 + ((hk >>> 8) % 10), r = 0.9 + (hk % 3) * 0.45;
      g.fillStyle = hd.pebbleDk; g.beginPath(); g.ellipse(cx + 0.3, cy + 0.45, r * 1.3, r, 0, 0, TAU); g.fill();
      g.fillStyle = hd.pebble; g.beginPath(); g.ellipse(cx, cy, r * 1.2, r * 0.85, 0, 0, TAU); g.fill();
      g.fillStyle = 'rgba(255,255,255,0.35)'; g.fillRect(cx - r * 0.6, cy - r * 0.5, r * 0.6, r * 0.35);
    }
    g.fillStyle = 'rgba(0,0,0,0.12)';
    for (let k = 0; k < 4; k++) { const hk = hash(x, y, k + 7); g.fillRect(X + (hk % 15), Y + ((hk >>> 6) % 15), 0.8, 0.8); }
  }

  function flower(g, x, y, col) {
    g.strokeStyle = '#3f8f34'; g.lineWidth = 0.5;
    g.beginPath(); g.moveTo(x, y); g.lineTo(x, y + 2.8); g.stroke();
    g.fillStyle = col;
    for (let i = 0; i < 5; i++) { const a = i * TAU / 5; g.beginPath(); g.arc(x + Math.cos(a) * 1.05, y + Math.sin(a) * 1.05, 0.8, 0, TAU); g.fill(); }
    g.fillStyle = '#ffd23f'; g.beginPath(); g.arc(x, y, 0.6, 0, TAU); g.fill();
  }

  function topCap(g, key, hd, x, y, X, Y, openL, openR) {
    const h = hash(x, y, 9);
    const L0 = X - (openL ? 0.6 : 0), R0 = X + T + (openR ? 0.6 : 0);
    if (key === 'prati' || key === 'orto' || key === 'cantine' || key === 'montagne') {
      const th = key === 'cantine' ? 3 : key === 'montagne' ? 4.5 : 5;
      g.beginPath();
      g.moveTo(L0, Y + 1);
      g.quadraticCurveTo(L0, Y - 0.6, L0 + 1.2, Y - 0.6);
      g.lineTo(R0 - 1.2, Y - 0.6);
      g.quadraticCurveTo(R0, Y - 0.6, R0, Y + 1);
      g.lineTo(R0, Y + th - 1);
      for (let i = 4; i >= 1; i--) {
        const sx = X + (i - 1) * 4, dip = (key === 'montagne' ? 2.4 : 1.6) + ((h >> i) & 1) * 0.8;
        g.quadraticCurveTo(sx + 2, Y + th + dip, sx, Y + th - 0.6);
      }
      g.lineTo(L0, Y + th - 0.6);
      g.closePath();
      g.fillStyle = lin(g, 0, Y - 1, 0, Y + th + 2, [[0, hd.cap[0]], [1, hd.cap[1]]]);
      g.fill();
      g.fillStyle = 'rgba(255,255,255,0.45)'; g.fillRect(L0 + 1, Y - 0.4, R0 - L0 - 2, 0.6);
      if (hd.blade) {
        g.fillStyle = hd.blade;
        for (let i = 0; i < 4; i++) {
          const bx = X + 1 + ((h >> (i * 3)) % 14), bh = 1.4 + ((h >> (i * 2)) % 3) * 0.7;
          g.beginPath(); g.moveTo(bx - 0.6, Y); g.lineTo(bx + 0.3, Y - bh); g.lineTo(bx + 0.8, Y); g.fill();
        }
      }
      if (key === 'prati' && h % 4 === 0) flower(g, X + 3 + (h % 10), Y - 2.6, ['#ff6fb5', '#ffffff', '#ffd23f', '#b58cff'][(h >> 4) % 4]);
      if (key === 'orto' && h % 9 === 0) {
        const cx = X + 4 + (h % 8);
        g.fillStyle = '#ff8a2a'; g.beginPath(); g.ellipse(cx, Y - 1.4, 2.2, 1.6, 0, 0, TAU); g.fill();
        g.strokeStyle = '#d0601a'; g.lineWidth = 0.3; g.beginPath(); g.moveTo(cx, Y - 3); g.lineTo(cx, Y + 0.2); g.stroke();
        g.fillStyle = '#4f8a3a'; g.fillRect(cx - 0.3, Y - 3.6, 0.7, 1);
      }
      if (key === 'cantine' && h % 3 === 0) { g.fillStyle = hd.cap[1]; g.beginPath(); g.ellipse(X + 3 + h % 10, Y + th + 1, 0.7, 1.9, 0, 0, TAU); g.fill(); }
      if (key === 'montagne' && h % 3 === 0) { g.fillStyle = 'rgba(255,255,255,0.9)'; star(g, X + 3 + h % 10, Y + 1.5, 1, 0.25, 4, 0); g.fill(); }
      return;
    }
    if (key === 'spiaggia') {
      g.fillStyle = lin(g, 0, Y - 0.5, 0, Y + 4, [[0, hd.cap[0]], [1, hd.cap[1]]]);
      rr(L0, Y - 0.6, R0 - L0, 4.2, 1.2, g); g.fill();
      g.strokeStyle = 'rgba(200,150,80,0.35)'; g.lineWidth = 0.4;
      g.beginPath(); g.moveTo(X + 1, Y + 6); g.quadraticCurveTo(X + 8, Y + 5, X + 15, Y + 6.5); g.stroke();
      if (h % 6 === 0) {
        const cx = X + 4 + (h % 8);
        g.fillStyle = '#ffb3c0'; g.beginPath(); g.moveTo(cx, Y); g.arc(cx, Y, 1.8, Math.PI, 0); g.closePath(); g.fill();
        g.strokeStyle = '#e07a90'; g.lineWidth = 0.3; for (let i = -1; i <= 1; i++) { g.beginPath(); g.moveTo(cx, Y); g.lineTo(cx + i * 1.2, Y - 1.4); g.stroke(); }
      } else if (h % 11 === 0) {
        g.fillStyle = '#ff9a3c'; star(g, X + 5 + (h % 7), Y - 0.8, 2, 0.8); g.fill();
      }
      return;
    }
    g.fillStyle = 'rgba(255,230,190,0.4)'; g.fillRect(X, Y, T, 0.8);
  }

  function underside(g, key, hd, x, y, X, Y) {
    const Yb = Y + T, h = hash(x, y, 3);
    g.fillStyle = lin(g, 0, Yb, 0, Yb + 7, [[0, hd.soil[1]], [1, shadeHex(hd.soil[1], -0.35)]]);
    g.fillRect(X, Yb, T + 0.3, 6.4);
    const tip = key === 'montagne' ? '#c8ecff' : shadeHex(hd.soil[1], -0.2);
    g.fillStyle = tip;
    for (let i = 0; i < 3; i++) {
      const sx = X + 1.5 + i * 5 + ((h >> i) & 1);
      g.beginPath(); g.moveTo(sx, Yb + 6); g.lineTo(sx + 1.6, Yb + 8 + ((h >> (i + 3)) & 1)); g.lineTo(sx + 3.2, Yb + 6); g.fill();
    }
    g.fillStyle = 'rgba(0,0,0,0.25)'; g.fillRect(X, Yb + 5.6, T, 0.6);
  }

  function plank(g, pal, X, Y, x) {
    g.fillStyle = 'rgba(0,0,0,0.18)'; g.fillRect(X, Y + 5, T, 2.2);
    g.fillStyle = lin(g, 0, Y, 0, Y + 5, [[0, pal[1]], [1, pal[2]]]);
    g.fillRect(X, Y, T, 5);
    g.fillStyle = 'rgba(255,255,255,0.4)'; g.fillRect(X, Y, T, 0.7);
    g.strokeStyle = 'rgba(0,0,0,0.2)'; g.lineWidth = 0.4;
    g.beginPath(); g.moveTo(X, Y + 2.5); g.bezierCurveTo(X + 5, Y + 1.8, X + 10, Y + 3.2, X + 16, Y + 2.5); g.stroke();
    g.fillStyle = 'rgba(0,0,0,0.3)'; g.fillRect(X + T - 0.5, Y, 0.5, 5);
    g.fillStyle = '#4a3f38'; g.fillRect(X + 2, Y + 1.8, 0.9, 0.9); g.fillRect(X + 13, Y + 1.8, 0.9, 0.9);
  }

  function spikes(g, key, th, X, Y, x) {
    if (th.halloween) {
      g.strokeStyle = '#5b3a6e'; g.lineWidth = 1.4;
      g.beginPath(); g.moveTo(X, Y + 14); g.bezierCurveTo(X + 5, Y + 10, X + 10, Y + 16, X + 16, Y + 12); g.stroke();
      g.fillStyle = th.spike[1];
      for (let i = 0; i < 4; i++) {
        const sx = X + 2 + i * 4, sy = Y + 12 + Math.sin(i * 1.7 + x) * 1.5;
        g.beginPath(); g.moveTo(sx - 1, sy); g.lineTo(sx, sy - 3.5 - (hash(x, i) % 2)); g.lineTo(sx + 1, sy); g.fill();
      }
      return;
    }
    const lt = key === 'montagne' ? '#eafaff' : '#f2f4fa', dk = key === 'montagne' ? '#7ac0e0' : '#9298b2';
    g.fillStyle = '#5e6480'; g.fillRect(X, Y + 15, T, 1);
    for (const cx of [X + 4, X + 12]) {
      g.beginPath(); g.moveTo(cx - 4, Y + 15.2); g.lineTo(cx, Y + 6.5); g.lineTo(cx, Y + 15.2); g.closePath(); g.fillStyle = lt; g.fill();
      g.beginPath(); g.moveTo(cx, Y + 6.5); g.lineTo(cx + 4, Y + 15.2); g.lineTo(cx, Y + 15.2); g.closePath(); g.fillStyle = dk; g.fill();
      g.strokeStyle = '#4a4f66'; g.lineWidth = 0.45;
      g.beginPath(); g.moveTo(cx - 4, Y + 15.2); g.lineTo(cx, Y + 6.5); g.lineTo(cx + 4, Y + 15.2); g.stroke();
    }
  }

  function crate(g, X, Y) {
    g.fillStyle = lin(g, 0, Y, 0, Y + T, [[0, '#d39a5a'], [1, '#8a5a2a']]);
    g.fillRect(X + 0.4, Y + 0.4, T - 0.8, T - 0.8);
    g.strokeStyle = '#5a3418'; g.lineWidth = 1.1;

        ctx.fillStyle = Math.sin(t * 2 + i + wx) > -0.7 ? '#ffd36a' : '#c09a40'; ctx.fillRect(hx + wx, hy + wy, ww, wh);
      }
    }
    const mw = [[10, 0.017, 1], [5, 0.041, 0]];
    ridge(c, 0.4, 196, mw, lin(ctx, 0, 180, 0, 272, [[0, '#2f2050'], [1, '#1e1438']]));
    const q = c * 0.4;
    for (let i = Math.floor(q / 120) - 1; i <= Math.floor((q + VW) / 120) + 1; i++) {
      if (hash(i, 12) % 2) continue;
      const tx = i * 120 + 30 - q, ty = ridgeY(tx + q, 196, mw) + 4;
      ctx.strokeStyle = '#1a1030'; ctx.lineCap = 'round';
      ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(tx, ty); ctx.lineTo(tx + 2, ty - 30); ctx.stroke();
      ctx.lineWidth = 1.5;
      for (const [a, l, yy] of [[-0.9, 14, 22], [0.8, 12, 26], [-0.5, 10, 14], [0.6, 9, 16]]) { ctx.beginPath(); ctx.moveTo(tx + 2, ty - yy); ctx.lineTo(tx + 2 + Math.sin(a) * l, ty - yy - Math.cos(a) * l * 0.6); ctx.stroke(); }
      ctx.lineCap = 'butt';
      const px0 = tx + 14, py0 = ty - 2;
      glow(px0, py0, 14, 'rgba(255,150,40,0.35)');
      ctx.fillStyle = '#ff8a2a'; ctx.beginPath(); ctx.ellipse(px0, py0, 5, 4, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = '#ffe27a'; ctx.beginPath(); ctx.moveTo(px0 - 3, py0 - 1); ctx.lineTo(px0 - 1.5, py0 - 2.5); ctx.lineTo(px0 - 0.5, py0 - 1); ctx.fill();
      ctx.beginPath(); ctx.moveTo(px0 + 3, py0 - 1); ctx.lineTo(px0 + 1.5, py0 - 2.5); ctx.lineTo(px0 + 0.5, py0 - 1); ctx.fill();
      ctx.fillRect(px0 - 2.5, py0 + 1, 5, 1);
    }
  }

  function bgCantine(c) {
    ctx.fillStyle = lin(ctx, 0, 0, 0, VH, [[0, '#1a1630'], [1, '#2b2547']]); ctx.fillRect(0, 0, VW, VH);
    const p = c * 0.3;
    for (let row = 0; row < 30; row++) {
      const y = row * 9, off = (row % 2) * 9;
      for (let x = -wrapX(p + off, 18) - 18; x < VW; x += 18) {
        const sh = hash(Math.floor((x + p + off) / 18), row) % 4;
        ctx.fillStyle = ['#2b2744', '#29253f', '#302b4d', '#26223b'][sh];
        ctx.fillRect(x, y, 17, 8);
        ctx.fillStyle = 'rgba(255,255,255,0.05)'; ctx.fillRect(x, y, 17, 0.8);
        ctx.fillStyle = 'rgba(0,0,0,0.25)'; ctx.fillRect(x, y + 7.2, 17, 0.8);
      }
    }
    for (let i = Math.floor(p / 240) - 1; i <= Math.floor((p + VW) / 240) + 1; i++) {
      const ax = i * 240 + 60 - p;
      ctx.fillStyle = lin(ctx, 0, 85, 0, 230, [[0, '#0d0a1c'], [1, '#18132c']]);
      ctx.beginPath(); ctx.moveTo(ax, 230); ctx.lineTo(ax, 120); ctx.arc(ax + 35, 120, 35, Math.PI, 0); ctx.lineTo(ax + 70, 230); ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.08)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(ax + 35, 120, 36, Math.PI, 0); ctx.stroke();
      const bx0 = ax + 16, by0 = 198;
      ctx.fillStyle = lin(ctx, bx0, 0, bx0 + 24, 0, [[0, '#5a3a24'], [0.5, '#8a5a34'], [1, '#4a2e1c']]);
      rr(bx0, by0, 24, 30, 6); ctx.fill();
      ctx.fillStyle = '#3a3a48'; ctx.fillRect(bx0, by0 + 6, 24, 2); ctx.fillRect(bx0, by0 + 21, 24, 2);
      const tx = i * 240 + 180 - p, fl = Math.sin(t * 11 + i * 3) * 0.8 + Math.sin(t * 17 + i) * 0.5;
      glow(tx + 2, 96, 55, 'rgba(255,160,60,0.32)');
      ctx.fillStyle = '#4a3a33'; ctx.fillRect(tx, 100, 4, 16); ctx.fillRect(tx - 2, 99, 8, 2);
      ctx.fillStyle = rad(ctx, tx + 2, 96, 0.5, 6, [[0, '#fff6c0'], [0.5, '#ffb03a'], [1, '#ff6a1a']]);
      ctx.beginPath(); ctx.moveTo(tx - 2, 99); ctx.quadraticCurveTo(tx - 2, 92, tx + 2 + fl, 88 - Math.abs(fl)); ctx.quadraticCurveTo(tx + 6, 92, tx + 6, 99); ctx.fill();
      ctx.strokeStyle = '#3a3a48'; ctx.lineWidth = 1;
      for (let k = 0; k < 6; k++) { ctx.beginPath(); ctx.ellipse(ax + 100, 6 + k * 5, 1.5, 2.5, 0, 0, TAU); ctx.stroke(); }
    }
  }

  function bgSoffitta(c) {
    ctx.fillStyle = lin(ctx, 0, 0, 0, VH, [[0, '#2a1c30'], [1, '#3d2b3f']]); ctx.fillRect(0, 0, VW, VH);
    const p = c * 0.3;
    for (let x = -wrapX(p, 24); x < VW; x += 24) {
      ctx.fillStyle = 'rgba(0,0,0,0.25)'; ctx.fillRect(x, 0, 1.5, VH);
      ctx.fillStyle = 'rgba(255,220,180,0.05)'; ctx.fillRect(x + 1.5, 0, 1, VH);
    }
    for (let i = Math.floor(p / 160) - 1; i <= Math.floor((p + VW) / 160) + 1; i++) {
      const bx = i * 160 - p;
      ctx.fillStyle = '#21152a';
      ctx.beginPath(); ctx.moveTo(bx, 46); ctx.lineTo(bx + 80, 0); ctx.lineTo(bx + 86, 0); ctx.lineTo(bx + 6, 46); ctx.fill();
      ctx.beginPath(); ctx.moveTo(bx + 80, 0); ctx.lineTo(bx + 160, 46); ctx.lineTo(bx + 154, 46); ctx.lineTo(bx + 74, 0); ctx.fill();
    }
    ctx.fillStyle = lin(ctx, 0, 40, 0, 52, [[0, '#2c1d32'], [1, '#170e1c']]); ctx.fillRect(0, 40, VW, 10);
    for (let i = Math.floor(p / 320) - 1; i <= Math.floor((p + VW) / 320) + 1; i++) {
      const wx = i * 320 + 140 - p, wy = 110;
      ctx.fillStyle = lin(ctx, wx - 10, wy, wx - 120, 270, [[0, 'rgba(255,240,200,0.16)'], [1, 'rgba(255,240,200,0)']]);
      ctx.beginPath(); ctx.moveTo(wx - 20, wy - 10); ctx.lineTo(wx + 20, wy + 10); ctx.lineTo(wx - 40, 272); ctx.lineTo(wx - 150, 272); ctx.fill();
      for (let k = 0; k < 10; k++) {
        const dx = wx - 40 - ((hash(i, k) % 90) + Math.sin(t * 0.5 + k) * 6), dy = wy + 40 + wrapX(hash(i, k, 2) % 130 - t * 6, 130);
        ctx.fillStyle = 'rgba(255,240,210,0.55)'; ctx.beginPath(); ctx.arc(dx, dy, 0.6, 0, TAU); ctx.fill();
      }
      ctx.fillStyle = '#1a1020'; ctx.beginPath(); ctx.arc(wx, wy, 30, 0, TAU); ctx.fill();
      ctx.fillStyle = lin(ctx, 0, wy - 25, 0, wy + 25, [[0, '#1d2366'], [1, '#3a3f8e']]); ctx.beginPath(); ctx.arc(wx, wy, 25, 0, TAU); ctx.fill();
      for (let k = 0; k < 6; k++) { ctx.fillStyle = 'rgba(255,255,255,0.8)'; ctx.fillRect(wx - 18 + hash(i, k, 5) % 30, wy - 18 + hash(i, k, 6) % 30, 0.8, 0.8); }
      ctx.fillStyle = '#fff1c1'; ctx.beginPath(); ctx.arc(wx + 8, wy - 8, 8, 0, TAU); ctx.fill();
      ctx.fillStyle = '#2a2f78'; ctx.beginPath(); ctx.arc(wx + 12, wy - 11, 7, 0, TAU); ctx.fill();
      ctx.fillStyle = '#3a2a3a'; ctx.fillRect(wx - 1.2, wy - 25, 2.4, 50); ctx.fillRect(wx - 25, wy - 1.2, 50, 2.4);
      ctx.strokeStyle = 'rgba(210,200,230,0.35)'; ctx.lineWidth = 0.5;
      const sx = wx + 90;
      for (let k = 0; k < 5; k++) { ctx.beginPath(); ctx.moveTo(sx, 50); ctx.lineTo(sx + 28 - k * 7, 50 + k * 8); ctx.stroke(); }
      for (let k = 1; k < 4; k++) { ctx.beginPath(); ctx.arc(sx, 50, k * 8, 0, Math.PI / 2); ctx.stroke(); }
      const lx = wx + 160 + Math.sin(t * 1.2 + i) * 6;
      ctx.strokeStyle = '#1a1020'; ctx.lineWidth = 0.8; ctx.beginPath(); ctx.moveTo(wx + 160, 50); ctx.lineTo(lx, 84); ctx.stroke();
      glow(lx, 90, 40, 'rgba(255,200,120,0.3)');
      ctx.fillStyle = '#5a3a2a'; ctx.beginPath(); ctx.moveTo(lx - 7, 90); ctx.lineTo(lx - 3, 84); ctx.lineTo(lx + 3, 84); ctx.lineTo(lx + 7, 90); ctx.fill();
      ctx.fillStyle = '#ffe2a0'; ctx.beginPath(); ctx.arc(lx, 91, 2.2, 0, TAU); ctx.fill();
      ctx.fillStyle = lin(ctx, wx - 70, 0, wx - 30, 0, [[0, '#5a3a30'], [1, '#3a2420']]); rr(wx - 70, 192, 40, 32, 3); ctx.fill();
      ctx.fillStyle = '#c9a24a'; ctx.fillRect(wx - 70, 200, 40, 2); ctx.fillRect(wx - 52, 204, 4, 6);
    }
  }

  function drawBG(c) {
    const k = lv.themeKey;
    if (k === 'prati') bgPrati(c);
    else if (k === 'spiaggia') bgSpiaggia(c);
    else if (k === 'montagne') bgMontagne(c);
    else if (k === 'orto') bgOrto(c);
    else if (k === 'cantine') bgCantine(c);
    else bgSoffitta(c);
  }

  // ---------- oggetti del mondo (alta risoluzione) ----------
  function drawLiquid(tx, ty) {
    const X = tx * T, Y = ty * T, [a, b] = lv.theme.liquid;
    const surf = tile(tx, ty - 1) !== '~';
    ctx.fillStyle = lin(ctx, 0, Y + 3, 0, Y + T, [[0, b], [1, a]]);
    ctx.beginPath();
    if (surf) {
      ctx.moveTo(X, Y + T + 0.3);
      for (let i = 0; i <= 16; i += 2) ctx.lineTo(X + i, Y + 5 + Math.sin(t * 3 + (X + i) * 0.25) * 1.2);
      ctx.lineTo(X + T, Y + T + 0.3);
    } else ctx.rect(X, Y, T, T + 0.3);
    ctx.fill();
    if (surf) {
      ctx.strokeStyle = 'rgba(255,255,255,0.75)'; ctx.lineWidth = 0.7;
      ctx.beginPath(); for (let i = 0; i <= 16; i += 2) ctx.lineTo(X + i, Y + 5 + Math.sin(t * 3 + (X + i) * 0.25) * 1.2); ctx.stroke();
      if (Math.sin(t * 2 + tx * 1.7) > 0.7) sparkle(X + 5 + (hash(tx, 1) % 7), Y + 6, 1.4, 0.8);
    }
    const ph = (t * 0.6 + (hash(tx, ty) % 100) / 100) % 1;
    if (ph < 0.7) {
      ctx.strokeStyle = 'rgba(255,255,255,0.6)'; ctx.lineWidth = 0.5;
      ctx.beginPath(); ctx.arc(X + 4 + (hash(tx, 5) % 8), Y + 14 - ph * 9, 0.9 + ph, 0, TAU); ctx.stroke();
    }
  }

  function drawCrumble(tx, ty) {
    const s = lv.crumble.get(ty * lv.w + tx);
    if (s && s.state === 'gone') return;
    const sh = s && s.state === 'shake' ? (Math.random() - 0.5) * 1.6 : 0;
    const X = tx * T + sh, Y = ty * T;
    plank(ctx, lv.theme.plank, X, Y, tx);
    ctx.strokeStyle = 'rgba(40,20,10,0.7)'; ctx.lineWidth = 0.5;
    ctx.beginPath(); ctx.moveTo(X + 5, Y); ctx.lineTo(X + 6.5, Y + 2); ctx.lineTo(X + 5.5, Y + 3.5); ctx.lineTo(X + 7, Y + 5);
    ctx.moveTo(X + 11, Y + 5); ctx.lineTo(X + 10, Y + 3); ctx.lineTo(X + 11.5, Y + 1.5); ctx.stroke();
  }

  function drawSpring(tx, ty) {
    const X = tx * T, Y = ty * T, sq = lv.springs.get(ty * lv.w + tx) || 0;
    const ext = 12 * Math.sin(sq * Math.PI);
    ctx.fillStyle = lin(ctx, 0, Y + 13, 0, Y + 16, [[0, '#9aa3b8'], [1, '#4a5168']]);
    rr(X + 1, Y + 13, 14, 3, 1); ctx.fill();
    const top = Y + 9 - ext;
    ctx.strokeStyle = '#d8dbe6'; ctx.lineWidth = 1.2; ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.moveTo(X + 8, Y + 13);
    const n = 4;
    for (let i = 1; i <= n; i++) ctx.lineTo(i % 2 ? X + 3.5 : X + 12.5, Y + 13 - (13 - (top - Y + 2)) * i / n);
    ctx.stroke();
    ctx.strokeStyle = 'rgba(80,90,120,0.6)'; ctx.lineWidth = 0.4; ctx.stroke();
    const red = lv.theme.halloween ? ['#ffb36b', '#e0661a'] : ['#ff8a8a', '#d62f3a'];
    ctx.fillStyle = lin(ctx, 0, top - 1, 0, top + 3, [[0, red[0]], [1, red[1]]]);
    rr(X, top - 1, 16, 3.6, 1.6); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.7)'; ctx.fillRect(X + 2, top - 0.6, 12, 0.6);
    if (!sq) {
      const bob = Math.sin(t * 4) * 1.2;
      ctx.fillStyle = 'rgba(255,255,255,0.85)';
      ctx.beginPath(); ctx.moveTo(X + 8, Y + 1 + bob); ctx.lineTo(X + 11, Y + 4.5 + bob); ctx.lineTo(X + 5, Y + 4.5 + bob); ctx.fill();
    }
  }

  function drawPlatform(p) {
    const x = p.x, y = p.y;
    if (lv.theme.halloween) {
      glow(x + p.w / 2, y + 3, 30, 'rgba(180,120,255,0.25)');
      ctx.fillStyle = lin(ctx, 0, y, 0, y + 6, [[0, '#9a7ad0'], [1, '#4a3478']]);
      rr(x, y, p.w, 6, 2); ctx.fill();
      ctx.fillStyle = `rgba(140,255,220,${(0.5 + 0.4 * Math.sin(t * 3)).toFixed(2)})`;
      for (let i = 0; i < 4; i++) { ctx.beginPath(); ctx.arc(x + 7 + i * 11, y + 3, 1, 0, TAU); ctx.fill(); }
      return;
    }
    ctx.fillStyle = 'rgba(60,100,160,0.15)'; ctx.beginPath(); ctx.ellipse(x + p.w / 2, y + 9, p.w / 2, 2.5, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = lin(ctx, 0, y - 6, 0, y + 8, [[0, '#ffffff'], [1, '#cfe4f8']]);
    ctx.beginPath();
    for (const [dx, dy, r] of [[7, 4, 5.5], [17, 1, 7.5], [29, 0, 7], [40, 4, 5.5]]) { ctx.moveTo(x + dx + r, y + dy); ctx.arc(x + dx, y + dy, r, 0, TAU); }
    ctx.rect(x + 3, y + 2, p.w - 6, 6);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.9)'; ctx.beginPath(); ctx.arc(x + 15, y - 2, 2.5, 0, TAU); ctx.fill();
  }

  function drawCheck(c) {
    const X = c.tx * T, Y = c.ty * T;
    if (lv.theme.check === 'candle') {
      ctx.fillStyle = lin(ctx, 0, Y + 12, 0, Y + 16, [[0, '#c0c0d8'], [1, '#6a6a88']]); rr(X + 2, Y + 13, 12, 3, 1.4); ctx.fill();
      ctx.fillStyle = lin(ctx, X + 5, 0, X + 11, 0, [[0, '#fffaf0'], [1, '#d8ccb0']]); rr(X + 5, Y + 2, 6, 11.5, 1); ctx.fill();
      ctx.fillStyle = '#fffaf0'; ctx.beginPath(); ctx.ellipse(X + 6, Y + 4.5, 0.8, 2, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = '#3a3040'; ctx.fillRect(X + 7.7, Y, 0.6, 2.2);
      if (c.lit) {
        const fl = Math.sin(t * 13 + c.tx) * 0.6;
        glow(X + 8, Y - 2, 30, 'rgba(255,180,80,0.35)');
        ctx.fillStyle = rad(ctx, X + 8, Y - 1, 0.3, 4, [[0, '#fff6c0'], [0.5, '#ffb03a'], [1, '#ff6a1a']]);
        ctx.beginPath(); ctx.moveTo(X + 6, Y + 0.5); ctx.quadraticCurveTo(X + 6, Y - 3, X + 8 + fl, Y - 6); ctx.quadraticCurveTo(X + 10, Y - 3, X + 10, Y + 0.5); ctx.fill();
      }
      return;
    }
    ctx.fillStyle = 'rgba(0,0,0,0.2)'; ctx.beginPath(); ctx.ellipse(X + 4, Y + 16, 4, 1.2, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = lin(ctx, X + 3, 0, X + 5, 0, [[0, '#ffffff'], [1, '#9aa0b8']]); ctx.fillRect(X + 3, Y - 13, 1.8, 29);
    ctx.fillStyle = rad(ctx, X + 3.5, Y - 14.5, 0.3, 2, [[0, '#fff6b0'], [1, '#e0a000']]); ctx.beginPath(); ctx.arc(X + 3.9, Y - 14, 1.8, 0, TAU); ctx.fill();
    const fy = c.lit ? Y - 12 : Y + 5, cols = c.lit ? ['#7fe06a', '#2f9a3a'] : ['#ff8a8a', '#d0303a'];
    ctx.fillStyle = lin(ctx, X + 5, fy, X + 16, fy + 7, [[0, cols[0]], [1, cols[1]]]);
    ctx.beginPath(); ctx.moveTo(X + 4.8, fy);
    for (let i = 0; i <= 11; i++) ctx.lineTo(X + 4.8 + i, fy + Math.sin(t * 6 - i * 0.6) * 0.9 * i / 11);
    for (let i = 11; i >= 0; i--) ctx.lineTo(X + 4.8 + i, fy + 7 + Math.sin(t * 6 - i * 0.6) * 0.9 * i / 11);
    ctx.closePath(); ctx.fill();
    if (c.lit) { ctx.fillStyle = '#fff6b0'; star(ctx, X + 10, fy + 3.5, 2.2, 0.9); ctx.fill(); }
  }

  function drawDoor(d) {
    const X = d.tx * T - 3, Y = d.ty * T - 19, w = 22, h = 35, hw = lv.theme.halloween;
    const frame = hw ? ['#5a4a6a', '#2a1e3a'] : ['#c9b49a', '#8a7458'];
    ctx.fillStyle = lin(ctx, 0, Y - 6, 0, Y + h, [[0, frame[0]], [1, frame[1]]]);
    ctx.beginPath(); ctx.moveTo(X - 2, Y + h); ctx.lineTo(X - 2, Y + 9); ctx.arc(X + w / 2, Y + 9, w / 2 + 2, Math.PI, 0); ctx.lineTo(X + w + 2, Y + h); ctx.fill();
    ctx.fillStyle = lin(ctx, 0, Y, 0, Y + h, [[0, '#fff3b0'], [1, '#ffbf4a']]);
    ctx.beginPath(); ctx.moveTo(X + 1, Y + h); ctx.lineTo(X + 1, Y + 10); ctx.arc(X + w / 2, Y + 10, w / 2 - 1, Math.PI, 0); ctx.lineTo(X + w - 1, Y + h); ctx.fill();
    const open = lv.doorOpen, ww = (w - 2) * (1 - open * 0.8);
    ctx.save();
    ctx.beginPath(); ctx.moveTo(X + 1, Y + h); ctx.lineTo(X + 1, Y + 10); ctx.arc(X + w / 2, Y + 10, w / 2 - 1, Math.PI, 0); ctx.lineTo(X + w - 1, Y + h); ctx.clip();
    const wood = hw ? ['#9a6038', '#5a3420'] : ['#5fd06a', '#2a8a3a'];
    ctx.fillStyle = lin(ctx, X + 1, 0, X + 1 + ww, 0, [[0, wood[0]], [1, wood[1]]]);
    ctx.fillRect(X + 1, Y, ww, h);
    ctx.fillStyle = 'rgba(0,0,0,0.18)';
    for (let i = 1; i < 4; i++) ctx.fillRect(X + 1 + ww * i / 4, Y, 0.6, h);
    if (ww > 8) {
      ctx.fillStyle = '#ffe680'; ctx.beginPath(); ctx.arc(X + 1 + ww / 2, Y + 12, 3, 0, TAU); ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,0.35)'; ctx.lineWidth = 0.6; ctx.stroke();
      ctx.fillStyle = rad(ctx, X + ww - 3, Y + 22, 0.2, 1.6, [[0, '#fff6b0'], [1, '#c08a00']]); ctx.beginPath(); ctx.arc(X + ww - 2.5, Y + 22, 1.4, 0, TAU); ctx.fill();
    }
    ctx.restore();
    if (open > 0) glow(X + w / 2, Y + h / 2, 40 * open, 'rgba(255,220,120,0.5)');
    if (hw) {
      glow(X + w / 2, Y - 6, 16, 'rgba(255,150,40,0.45)');
      ctx.fillStyle = '#ff8a2a'; ctx.beginPath(); ctx.ellipse(X + w / 2, Y - 6, 5, 4, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = '#ffe27a'; ctx.fillRect(X + w / 2 - 3, Y - 7, 2, 1.6); ctx.fillRect(X + w / 2 + 1, Y - 7, 2, 1.6); ctx.fillRect(X + w / 2 - 2.5, Y - 4.5, 5, 1);
    } else {
      glow(X + w / 2, Y - 8, 14, 'rgba(255,230,120,0.5)');
      ctx.fillStyle = lin(ctx, 0, Y - 13, 0, Y - 3, [[0, '#fff6b0'], [1, '#ffbf1f']]);
      star(ctx, X + w / 2, Y - 8, 5, 2.2); ctx.fill();
    }
  }

  function heartShape(x, y, s) {
    ctx.beginPath();
    ctx.moveTo(x, y + s * 0.35);
    ctx.bezierCurveTo(x, y - s * 0.15, x - s, y - s * 0.15, x - s, y + s * 0.42);
    ctx.bezierCurveTo(x - s, y + s * 0.85, x - s * 0.25, y + s * 1.1, x, y + s * 1.4);
    ctx.bezierCurveTo(x + s * 0.25, y + s * 1.1, x + s, y + s * 0.85, x + s, y + s * 0.42);
    ctx.bezierCurveTo(x + s, y - s * 0.15, x, y - s * 0.15, x, y + s * 0.35);
    ctx.closePath();
  }
  function heart(x, y, s, full) {
    heartShape(x, y, s);
    ctx.fillStyle = full ? lin(ctx, 0, y - s * 0.2, 0, y + s * 1.4, [[0, '#ff9ab0'], [1, '#e0203f']]) : 'rgba(255,255,255,0.2)';
    ctx.fill();
    ctx.strokeStyle = full ? '#7a1028' : 'rgba(255,255,255,0.45)'; ctx.lineWidth = 0.6; ctx.stroke();
    if (full) { ctx.fillStyle = 'rgba(255,255,255,0.75)'; ctx.beginPath(); ctx.ellipse(x - s * 0.45, y + s * 0.3, s * 0.22, s * 0.14, -0.5, 0, TAU); ctx.fill(); }
  }
  function brokenHeart(x, y, s, k) {
    for (const side of [-1, 1]) {
      ctx.save();
      ctx.beginPath(); ctx.rect(side < 0 ? x - s * 1.3 : x, y - s, s * 1.3, s * 3); ctx.clip();
      ctx.translate(side * k * 4, k * 6);
      ctx.globalAlpha = Math.max(0, 1 - k);
      heart(x, y, s, true);
      ctx.restore();
    }
  }

  function drawCoin(x, y, ph, col, size = 1) {
    y += Math.sin(t * 3 + ph) * 1.5;
    if (save.mode === 'halloween') {
      const c = COIN_H[col];

  function drawProj(p) {
    if (p.kind === 'onda') {
      const h = 11 + Math.sin(p.t * 20) * 1.5, dir = Math.sign(p.vx);
      ctx.fillStyle = lin(ctx, 0, p.gy - h, 0, p.gy, [[0, 'rgba(255,255,255,0.9)'], [1, 'rgba(180,210,255,0.4)']]);
      ctx.beginPath(); ctx.moveTo(p.x - 8 * dir, p.gy); ctx.quadraticCurveTo(p.x - 2 * dir, p.gy - h * 1.2, p.x + 6 * dir, p.gy - h * 0.4); ctx.quadraticCurveTo(p.x + 3 * dir, p.gy - h * 0.2, p.x + 7 * dir, p.gy); ctx.fill();
      return;
    }
    if (p.kind === 'ghiacciolo') {
      if (p.t < 0) return;
      if (p.t < 0.75) {
        if (Math.floor(p.t * 10) % 2) { ctx.fillStyle = 'rgba(255,60,60,0.75)'; ctx.beginPath(); ctx.ellipse(p.x, p.gy - 0.5, 8, 2, 0, 0, TAU); ctx.fill(); }
      }
      const jx = p.t < 0.75 ? Math.sin(t * 50) * 0.8 : 0;
      ctx.fillStyle = lin(ctx, p.x - 3, 0, p.x + 3, 0, [[0, '#ffffff'], [1, '#8fd4ff']]);
      ctx.beginPath(); ctx.moveTo(p.x - 3.5 + jx, p.y); ctx.lineTo(p.x + 3.5 + jx, p.y); ctx.lineTo(p.x + jx, p.y + 13); ctx.closePath(); ctx.fill();
      return;
    }
    if (p.kind === 'bolla') {
      if (p.t < 0) return;
      ctx.fillStyle = rad(ctx, p.x - 2, p.y - 2, 0.5, 7, [[0, 'rgba(255,255,255,0.5)'], [1, 'rgba(120,200,255,0.25)']]);
      ctx.beginPath(); ctx.arc(p.x, p.y, 6, 0, TAU); ctx.fill();
      ctx.strokeStyle = 'rgba(220,245,255,0.9)'; ctx.lineWidth = 0.6; ctx.stroke();
      ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.ellipse(p.x - 2.4, p.y - 2.4, 1.4, 0.9, -0.7, 0, TAU); ctx.fill();
      return;
    }
    const s = PROJ[p.kind];
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.t * 8);

      ctx.fillStyle = '#efe9dc'; ctx.fillRect(-4, -1, 8, 2);

    } else {
      ctx.fillStyle = rad(ctx, -p.r * 0.35, -p.r * 0.35, 0.3, p.r * 1.1, [[0, shadeHex(s.col.length === 7 ? s.col : '#ffffff', 0.5)], [1, s.col]]);
      ctx.beginPath(); ctx.arc(0, 0, p.r, 0, TAU); ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,0.3)'; ctx.lineWidth = 0.5; ctx.stroke();
      if (p.kind === 'bomba') {
        ctx.fillStyle = '#4f8a3a'; ctx.fillRect(-0.6, -p.r - 2.5, 1.2, 2.5);
        if (Math.floor(t * 12) % 2) sparkle(0, -p.r - 3.2, 1.8, 1);
      }
      if (p.kind === 'cocco') { ctx.fillStyle = '#3a2410'; ctx.beginPath(); ctx.arc(-1, -1, 0.7, 0, TAU); ctx.arc(1, -1, 0.7, 0, TAU); ctx.arc(0, 1, 0.7, 0, TAU); ctx.fill(); }
    }
    ctx.restore();
  }

  function groundY(x, y) {
    const tx = Math.floor(x / T);
    for (let ty = Math.max(0, Math.floor(y / T)); ty < ROWS; ty++) if (standable(tile(tx, ty))) return ty * T;
    return null;
  }
  function shadowAt(x, y, w) {
    const gy = groundY(x, y);
    if (gy === null) return;
    const d = gy - y;
    if (d < -2 || d > 90) return;
    const k = 1 - Math.max(0, d) / 90;
    ctx.fillStyle = `rgba(20,20,50,${(0.3 * k).toFixed(3)})`;
    ctx.beginPath(); ctx.ellipse(x, gy + 0.3, w * (0.35 + 0.25 * k), 1.6 + k, 0, 0, TAU); ctx.fill();
  }

  // ---------- nemici di Halloween (disegnati a mano, sul livello dei personaggi) ----------
  function drawHalloween(e) {
    const x = Math.round(e.x), y = Math.round(e.y), d = e.dir > 0 ? 1 : 0, step = Math.floor(e.t * 8) % 2;

      px(x + 3 + o, y + 5, 2, 2, '#3a1a10'); px(x + 7 + o, y + 5, 2, 2, '#3a1a10');

      px(x + 4 - step, y + 14, 1, 4, Bd); px(x + 7 + step, y + 14, 1, 4, Bd);
      px(x + 5, y + 9, 2, 6, B); px(x + 3, y + 10, 6, 1, B); px(x + 3, y + 12, 6, 1, Bd);
      const arm = e.st === 'throw' ? -4 : 0;
      px(x + 1, y + 10, 1, 4, Bd); px(x + 10, y + 10 + arm, 1, 4, Bd);
      px(x + 2, y, 8, 7, B); px(x + 3, y + 7, 6, 2, Bd); px(x + 3, y, 5, 1, '#ffffff');
      px(x + 3 + o, y + 2, 2, 2, Kk); px(x + 7 + o, y + 2, 2, 2, Kk); px(x + 5 + o, y + 5, 2, 1, Kk);
    } else if (type === 'pipistrello') {
      const W = '#5b3d8a', up = Math.sin(e.t * 20) > 0;
      px(x + 5, y + 2, 4, 5, W); px(x + 5, y + 2, 4, 1, '#7a5aaa');

    } else if (type === 'melma') {
      const G = '#79d24b', air = !e.onGround, h = air ? 11 : 9, w = air ? 10 : 14, ox = (14 - w) / 2;
      px(x + ox, y + 10 - h + 2, w, h - 2, G); px(x + ox + 2, y + 10 - h, w - 4, 2, '#a6ee70');
      px(x + ox, y + 8, w, 2, '#4f9a2a');
      px(x + ox + 2, y + 10 - h + 2, 2, 2, '#e0ffc0');
      px(x + ox + w / 2 - 3, y + 10 - h + 4, 2, 2, '#1d3a10'); px(x + ox + w / 2 + 1, y + 10 - h + 4, 2, 2, '#1d3a10');
    } else if (type === 'fantasma') {

      const wv = Math.floor(e.t * 6) % 2;
      px(x + 1, Y + 12, 3, 2 + wv, '#cbd8f4'); px(x + 5, Y + 12, 4, 3 - wv, '#cbd8f4'); px(x + 10, Y + 12, 3, 2 + wv, '#cbd8f4');
      ctx.globalAlpha = 1;
      px(x + 2, Y + 8, 2, 1, '#ffb3c8'); px(x + 10, Y + 8, 2, 1, '#ffb3c8');
      if (e.shy) { px(x + 3, Y + 4, 3, 3, '#cfdcff'); px(x + 8, Y + 4, 3, 3, '#cfdcff'); }
      else { const o = e.dir > 0 ? 1 : 0; px(x + 4 + o, Y + 4, 2, 3, '#1d1530'); px(x + 8 + o, Y + 4, 2, 3, '#1d1530'); px(x + 6 + o, Y + 9, 2, 2, '#ff7aa8'); }
    }
  }

  function drawEnemy(e) {
    const k = e.k;
    if (!e.alive) {
      if (k.reassemble) {
        const x = Math.round(e.x), y = Math.round(e.y), B = '#efe9dc';
        px(x, y + e.h - 2, 12, 2, B); px(x + 2, y + e.h - 4, 3, 2, B); px(x + 3, y + e.h - 10, 7, 6, B);
        px(x + 4, y + e.h - 8, 2, 2, '#2a1a2a'); px(x + 7, y + e.h - 8, 2, 2, '#2a1a2a');
        const a = t * 6;
        px(x + 6 + Math.cos(a) * 7, y + e.h - 12 + Math.sin(a) * 2, 2, 2, '#ffd23f');
        return;
      }
      if (e.timer <= 0) return;
      ctx.globalAlpha = clamp(e.timer / 0.6, 0, 1);
      ctx.save();
      ctx.translate(e.x + e.w / 2, e.y + e.h);
      ctx.scale(1.2, 0.35);
      ctx.translate(-(e.x + e.w / 2), -(e.y + e.h));
      if (k.draw) drawHalloween(e); else drawSpriteEnemy(e);
      ctx.restore();
      ctx.globalAlpha = 1;
      return;
    }
    if (k.beh === 'dropper') {
      ctx.fillStyle = 'rgba(230,230,240,0.7)';
      ctx.fillRect(Math.round(e.x + e.w / 2), 0, 1, Math.round(e.y + 2));
    }
    if (k.beh === 'popper') {
      const X = Math.round(e.x), gy = e.gy + e.h;
      px(X - 1, gy - 3, e.w + 2, 3, lv.theme.dirt); px(X + 1, gy - 5, e.w - 2, 2, lv.theme.dirt);
      px(X + 2, gy - 5, 3, 1, lv.theme.speckB);
      if (e.st === 'down') return;
      const rise = e.st === 'rise' ? 1 - e.timer / 0.25 : 1;
      ctx.save();
      ctx.beginPath(); ctx.rect(X - 4, 0, e.w + 8, gy - 3); ctx.clip();
      ctx.translate(0, Math.round((1 - rise) * e.h));
      drawSpriteEnemy(e);
      ctx.restore();
      return;
    }
    const wind = k.beh === 'charger' && e.st === 'wind';
    if (wind) { ctx.save(); ctx.translate(Math.round(Math.sin(t * 60)), 0); }
    if (k.draw) drawHalloween(e); else drawSpriteEnemy(e);
    if (wind) ctx.restore();
  }

  function drawSpriteEnemy(e) {
    const k = e.k, s = SPR[k.spr];
    let pal = k.pal ? { ...s.pal, ...k.pal } : s.pal;
    if (k.beh === 'spiky' && !e.spikes) pal = { ...pal, s: null };
    const bob = (k.beh === 'walker' || k.beh === 'charger' || k.beh === 'spiky') && Math.floor(e.t * 8) % 2 ? -1 : 0;
    drawMap(ctx, s.map, pal, e.x + e.w / 2 - s.w / 2, e.y + e.h - s.h + bob, e.dir < 0, 1, s.w, true);
  }

  function drawBoss(b) {
    ctx.save();
    let x = Math.round(b.x), y = Math.round(b.y);
    if (b.defeated) { ctx.translate(x + b.w / 2, y + b.h); ctx.scale(0.4, 0.4); ctx.translate(-b.w / 2, -b.h); x = 0; y = 0; }
    if (b.inv > 0 && Math.floor(t * 20) % 2) ctx.globalAlpha = 0.45;
    if (b.state === 'windup') ctx.translate(Math.round(Math.sin(t * 60) * 1.5), 0);
    const def = b.def;
    if (def.spr) {
      const s = SPR[def.spr];
      let pal = s.pal;
      if (b.state === 'dizzy') pal = { ...pal, s: '#8a5a3a', e: '#ffffff' };
      if (def.spr === 'riccio' && b.state === 'charge') {
        const cx = x + b.w / 2, cy = y + b.h / 2, r = b.h / 2;
        ctx.fillStyle = '#5a3a2a'; ctx.beginPath(); ctx.arc(cx, cy, r, 0, TAU); ctx.fill();
        ctx.fillStyle = '#7a4a32'; ctx.beginPath(); ctx.arc(cx - 3, cy - 3, r * 0.6, 0, TAU); ctx.fill();
        ctx.strokeStyle = '#8a5a3a'; ctx.lineWidth = 3;
        for (let i = 0; i < 8; i++) { const a = i * 0.785 + t * 14 * b.dir; ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + Math.cos(a) * (r + 4), cy + Math.sin(a) * (r + 4)); ctx.stroke(); }
      } else {
        drawMap(ctx, s.map, pal, x + b.w / 2 - (s.w * def.scale) / 2, y + b.h - s.h * def.scale, b.dir < 0, def.scale, s.w, true);
      }
      if (def.crown && b.state !== 'charge') { drawPix(['#..#..#', '#######', '#######'], x + b.w / 2 - 4 + (b.dir < 0 ? -6 : 6), y - 6, '#ffd23f'); drawPix(['.......', '.#...#.'], x + b.w / 2 - 4 + (b.dir < 0 ? -6 : 6), y - 5, '#ff4a6a'); }
      if (def.pirate) { px(x + b.w / 2 - 12, y - 4, 24, 4, '#2a2a3a'); px(x + b.w / 2 - 6, y - 10, 12, 6, '#2a2a3a'); px(x + b.w / 2 - 1, y - 8, 3, 3, '#ffffff'); px(x + b.w / 2 - 12, y - 4, 24, 1, '#4a4a5a'); }
    } else {
      drawHalloweenBoss(b, x, y);

    if (b.state === 'dizzy') {

      for (let i = 0; i < 3; i++) px(x + b.w / 2 + Math.cos(a + i * 2.1) * 14, y - 6 + Math.sin(a + i * 2.1) * 3, 3, 3, '#ffd23f');
    }

  function drawHalloweenBoss(b, x, y) {

      px(x + 8 + o, y + 20, 20, 5, Kk); px(x + 12 + o, y + 20, 3, 2, O); px(x + 21 + o, y + 20, 3, 2, O);

    }
  }

  function drawPlayer() {
    if (state === 'play' && P.inv > 0 && Math.floor(t * 16) % 2) return;

  function drawHUD() {

    ctx.font = '10px "Lilita One", sans-serif';

    const wl = Math.max(16 + D.hearts * 10 + 46, nameW + 20);

      const hx = 16 + i * 10, hy = 21;
      if (fx && fx.idx === i && fx.t < 0.9) brokenHeart(hx, hy, 3.6, fx.t);
      else heart(hx, hy, 3.6, i < P.hearts);
    }
    const cx = 16 + D.hearts * 10 + 6;
    drawCoin(cx, 26, 0, 2, 0.75);
    label(`${lv.got}/${lv.total}`, cx + 6, 26.5, 8.5, '#ffe680', 'left', 'Fredoka', 700);
    const lbl = lv.tutorial ? 'Tutorial' : `${lv.world + 1}-${lv.n % LPW + 1} · ${lv.name}`;
    ctx.font = '700 8.5px Fredoka, sans-serif';
    const lw = Math.max(ctx.measureText(lbl).width, 70) + 16;
    panel(VW - 5 - lw, 5, lw, 33);
    label(lbl, VW - 12, 14, 8.5, '#ffffff', 'right', 'Fredoka', 700);
    label(`● ${save.coins} monete`, VW - 12, 28, 8, '#ffe680', 'right', 'Fredoka', 700);
    if (save.admin) label('ADMIN', VW - 12, 45, 8, '#ff6a6a', 'right', 'Fredoka', 700);
    const b = lv.boss;
    if (b && b.state !== 'sleep' && !b.defeated) {
      const bw = 170, bx = (VW - bw) / 2;
      panel(bx - 8, 40, bw + 16, 26);
      label(b.def.name, VW / 2, 48, 9, '#ffcf7a', 'center', 'Lilita One');
      rr(bx, 55, bw, 6, 3); ctx.fillStyle = 'rgba(0,0,0,0.45)'; ctx.fill();
      const fw = Math.max(0, bw * b.hp / b.maxHp);
      if (fw > 0) {
        rr(bx, 55, fw, 6, 3);
        ctx.fillStyle = lin(ctx, 0, 55, 0, 61, b.hp <= b.maxHp / 2 ? [[0, '#ff8a8a'], [1, '#d0202a']] : [[0, '#ffd27a'], [1, '#ff7a1a']]);
        ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.45)'; ctx.fillRect(bx + 2, 55.6, Math.max(0, fw - 4), 1);
      }
    }
  }

  function banner(title, sub) {
    const w = 230, x = (VW - w) / 2, y = 96;
    ctx.fillStyle = 'rgba(0,0,0,0.25)'; rr(x + 2, y + 3, w, 56, 12); ctx.fill();
    ctx.fillStyle = lin(ctx, 0, y, 0, y + 56, save.mode === 'halloween' ? [[0, '#5a3a8a'], [1, '#2e1f52']] : [[0, '#ffb05a'], [1, '#ff6a2a']]);
    rr(x, y, w, 56, 12); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.6)'; ctx.lineWidth = 1; rr(x + 2, y + 2, w - 4, 52, 10); ctx.stroke();
    label(title, VW / 2, y + 22, 20, '#ffffff', 'center', 'Lilita One');
    label(sub, VW / 2, y + 42, 10, '#fff6e0', 'center', 'Fredoka', 700);
  }

  function drawDeathCard() {
    const d = death;
    if (!d || d.phase === 'freeze') return;
    const a = d.phase === 'fly' ? clamp((1.3 - d.t) / 0.3, 0, 1) : 1;
    ctx.globalAlpha = a;
    const w = 300, h = 104, x = (VW - w) / 2, y = 70;
    ctx.fillStyle = 'rgba(0,0,0,0.3)'; rr(x + 3, y + 4, w, h, 14); ctx.fill();
    ctx.fillStyle = '#fffaf0'; rr(x, y, w, h, 14); ctx.fill();
    ctx.fillStyle = d.out ? '#ff4a5a' : '#ff8a2a';
    ctx.save(); rr(x, y, w, h, 14); ctx.clip(); ctx.fillRect(x, y, w, 6); ctx.restore();
    label(d.out ? 'Cuori finiti!' : 'Ops!', VW / 2, y + 24, 20, d.out ? '#e0303f' : '#ff7a1a', 'center', 'Lilita One');
    label(d.cause, VW / 2, y + 45, 10, '#2a1a3a', 'center', 'Fredoka', 600);
    const bt = d.phase === 'fly' ? null : (d.phase === 'card' ? (1.3 - d.t) : 0.89);
    const n = D.hearts, hx = VW / 2 - (n - 1) * 7;
    for (let i = 0; i < n; i++) {
      const lost = i === Math.max(0, P.hearts);
      if (lost && bt !== null && bt < 0.9) brokenHeart(hx + i * 14, y + 58, 5, bt);
      else if (!(lost && bt !== null)) heart(hx + i * 14, y + 58, 5, i < P.hearts || (lost && bt === null));
    }
    label(d.out ? 'Riparti dalla bandierina con tutti i cuori' : 'Riparti dalla bandierina', VW / 2, y + 90, 8.5, '#7a6a8a', 'center', 'Fredoka', 600);
    ctx.globalAlpha = 1;
  }

  function drawIris(radius, cx, cy) {
    ctx.save();
    ctx.fillStyle = '#0d0a1a';
    ctx.beginPath();
    ctx.rect(0, 0, VW, VH);
    ctx.arc(cx, cy, Math.max(0, radius), 0, TAU, true);
    ctx.fill('evenodd');
    ctx.restore();
  }

  function draw() {
    const c = Math.round(cam * S) / S;
    const sx = shake > 0 ? Math.round((Math.random() - 0.5) * 4) : 0;
    const hwMode = lv.theme.halloween;
    ctx = mainCtx;
    ctx.setTransform(S, 0, 0, S, 0, 0);
    ctx.imageSmoothingEnabled = true;
    drawBG(c);

    ctx.save();
    ctx.translate(-c + sx, 0);
    const t0 = Math.max(0, Math.floor(c / T) - 1), t1 = Math.min(lv.w - 1, Math.floor((c + VW) / T) + 1);
    drawTileChunks(c);
    for (let y = 0; y < ROWS; y++) for (let x = t0; x <= t1; x++) {
      const ch = lv.grid[y][x];
      if (ch === '~') drawLiquid(x, y);
      else if (ch === '-') drawCrumble(x, y);
      else if (ch === 'S') drawSpring(x, y);
    }
    for (const p of lv.plats) drawPlatform(p);
    for (const cd of lv.checks) drawCheck(cd);
    if (lv.door) drawDoor(lv.door);
    const menuDemo = state === 'title' || state === 'levels' || state === 'hero' || state === 'login' || state === 'story';
    for (const e of lv.enemies) if (e.alive && e.k.beh !== 'popper') shadowAt(e.x + e.w / 2, e.y + e.h, e.w);
    if (lv.boss && !lv.boss.defeated) shadowAt(lv.boss.x + lv.boss.w / 2, lv.boss.y + lv.boss.h, lv.boss.w);
    const showP = !menuDemo && !(state === 'clear' && lv.doorOpen >= 1) && state !== 'dying';
    if (showP) shadowAt(P.x + P.w / 2, P.y + P.h, 13);
    ctx.restore();

    // personaggi in pixel art, con contorno scuro
    entCtx.setTransform(1, 0, 0, 1, 0, 0);
    entCtx.clearRect(0, 0, VW, VH);
    ctx = entCtx;
    ctx.save();
    ctx.translate(Math.round(-c + sx), 0);
    for (const e of lv.enemies) drawEnemy(e);
    if (lv.boss) drawBoss(lv.boss);
    if (!menuDemo && !(state === 'clear' && lv.doorOpen >= 1)) {
      if (state === 'clear') ctx.globalAlpha = 1 - lv.doorOpen;
      drawPlayer();
      ctx.globalAlpha = 1;
    }
    ctx.restore();
    ctx = mainCtx;
    outlCtx.globalCompositeOperation = 'source-over';
    outlCtx.clearRect(0, 0, VW, VH);
    for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) outlCtx.drawImage(ent, dx, dy);
    outlCtx.globalCompositeOperation = 'source-in';
    outlCtx.fillStyle = hwMode ? '#0c0618' : '#1d1a3a';
    outlCtx.fillRect(0, 0, VW, VH);
    outlCtx.globalCompositeOperation = 'source-over';
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(outl, 0, 0, VW, VH);
    ctx.drawImage(ent, 0, 0, VW, VH);
    ctx.imageSmoothingEnabled = true;

    ctx.save();
    ctx.translate(-c + sx, 0);
    for (const cn of lv.coins) if (!cn.got) drawCoin(cn.x, cn.y, cn.ph, cn.col);
    for (const cn of lv.loose) if (!cn.got) drawCoin(cn.x, cn.y, 0, cn.col);
    for (const h of lv.hearts) if (!h.got) { glow(h.x, h.y, 10, 'rgba(255,90,120,0.3)'); heart(h.x, h.y - 4 + Math.sin(t * 3) * 1.5, 4.5, true); }
    for (const p of lv.projs) drawProj(p);
    for (const p of particles) {
      ctx.globalAlpha = clamp(p.life / p.max, 0, 1);
      ctx.fillStyle = p.col; ctx.beginPath(); ctx.arc(p.x, p.y, 1.2, 0, TAU); ctx.fill();
    }
    ctx.globalAlpha = 1;
    for (const b of bubbles) drawBubble(b);
    ctx.restore();

    // nebbia e luce
    if (hwMode) {
      for (let k = 0; k < 3; k++) {
        const fy = 200 + k * 18, off = wrapX(t * (6 + k * 4) - c * (0.3 + k * 0.2), 240);
        for (let x = -off - 120; x < VW + 120; x += 240) {
          ctx.fillStyle = rad(ctx, x + 60, fy, 2, 90, [[0, 'rgba(210,190,255,0.10)'], [1, 'rgba(210,190,255,0)']]);
          ctx.fillRect(x - 40, fy - 40, 200, 80);
        }
      }
    }
    ctx.fillStyle = rad(ctx, VW / 2, VH / 2, VH * 0.42, VW * 0.72, [[0, 'rgba(0,0,0,0)'], [1, hwMode ? 'rgba(8,0,24,0.55)' : 'rgba(20,40,90,0.22)']]);
    ctx.fillRect(0, 0, VW, VH);

    if (menuDemo) return;
    if (flash > 0) {
      ctx.fillStyle = rad(ctx, VW / 2, VH / 2, VH * 0.3, VW * 0.6, [[0, 'rgba(255,40,40,0)'], [1, `rgba(255,40,40,${Math.min(0.5, flash * 2).toFixed(2)})`]]);
      ctx.fillRect(0, 0, VW, VH);
    }
    drawHUD();
    if (state === 'dying' && death) {
      if (death.phase === 'freeze') { ctx.fillStyle = 'rgba(0,0,0,0.25)'; ctx.fillRect(0, 0, VW, VH); }
      if (death.phase === 'iris') drawIris(320 * (death.t / 0.45), clamp(death.sx - c + 6, 40, VW - 40), clamp(death.sy, 60, VH - 40));
      drawDeathCard();
    } else if (iris) {
      drawIris(320 * (1 - iris.t / iris.max), P.x + P.w / 2 - c, P.y + P.h / 2);
    }
    if (lv.introT > 0 && state === 'play' && !iris) {
      ctx.globalAlpha = clamp(lv.introT / 0.5, 0, 1);
      banner(lv.tutorial ? 'Tutorial' : `Mondo ${lv.world + 1}-${lv.n % LPW + 1}`, lv.name);
      ctx.globalAlpha = 1;
    }
  }

  // ================= ciclo =================
  const STEP = 1 / 60;
  let last = performance.now(), acc = 0;
  function frame(now) {
    let d = (now - last) / 1000;
    last = now;
    if (d > 0.1) d = 0.1;
    acc += d;
    while (acc >= STEP) { update(STEP); acc -= STEP; }
    shake = Math.max(0, shake - d);
    draw();
    if (state === 'hero') drawHeroPreview();
    requestAnimationFrame(frame);
  }

  function start(data) {
    const d = data || {};
    applyMode();
    loadLevel(0);
    fitCanvas();
    if (Number.isInteger(d.curLevel) && d.curLevel >= -1 && d.curLevel < TOTAL && d.inLevel && save.hero) {
      curLevel = d.curLevel;
      loadLevel(curLevel);
      state = 'pause';
      showScreen('scrPause');
    } else if (!window.claude) {
      showTitle();
    } else {
      state = 'login';
      showScreen('scrLogin');
    }
    if (document.fonts && document.fonts.load) ['10px "Lilita One"', '600 10px Fredoka', '700 10px Fredoka'].forEach(f => document.fonts.load(f).catch(() => {}));
    requestAnimationFrame(t0 => { last = t0; requestAnimationFrame(frame); });
  }

  const hot = window.claude?.hot;
  if (hot && typeof hot.snapshot === 'function') hot.snapshot(() => ({ curLevel, inLevel: (inGame() || state === 'pause') && state !== 'tip' }));
  hot?.ready ? hot.ready(start) : start(hot?.data ?? {});

  // Agganci usati solo dai test automatici.
  window.__salta = {
    get state() { return state; }, get P() { return P; }, get lv() { return lv; }, get death() { return death; }, keys, save,
    startLevel, step(n) { for (let i = 0; i < n; i++) update(STEP); }, press() { jumpPressed = true; keys.jump = true; },
    pressDown() { downPressed = true; keys.down = true; }, advanceTip, get tip() { return tip; }, cloud,
    setDiff(k) { save.diff = k; D = DIFFS[k]; }, setMode(m) { save.mode = m; applyMode(); }, openHero, showTitle, draw
  };
})();
</script>

</body>
